<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#10bfa3">

<title>ZIQVONA</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;
  background: #eefaf7;
  color: #102a27;
}

button,
input,
textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   LOGIN
========================= */

#loginPage {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background:
    linear-gradient(
      135deg,
      #08bfa3,
      #087f73
    );
}

.login-card {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 28px;
  padding: 35px 28px;
  box-shadow:
    0 20px 60px rgba(0,0,0,.18);
  text-align: center;
}

.logo {
  width: 80px;
  height: 80px;
  margin: 0 auto 18px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #10bfa3;
  color: white;
  font-size: 38px;
  font-weight: 900;
}

.login-card h1 {
  margin: 0;
  font-size: 32px;
}

.tagline {
  color: #6b7d79;
  margin: 10px 0 25px;
  font-size: 14px;
  letter-spacing: .5px;
}

.login-card input {
  width: 100%;
  padding: 15px;
  border: 1px solid #d8e6e3;
  border-radius: 14px;
  outline: none;
  font-size: 16px;
  margin-bottom: 12px;
}

.login-card input:focus {
  border-color: #10bfa3;
}

.primary-btn {
  width: 100%;
  border: 0;
  background: #10bfa3;
  color: white;
  padding: 15px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 800;
}

.primary-btn:hover {
  background: #0aa88f;
}

/* =========================
   APP
========================= */

#app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* TOP */

.topbar {
  height: 70px;
  background: white;
  border-bottom: 1px solid #dce9e6;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: #10bfa3;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 900;
  font-size: 21px;
}

.brand-name {
  font-size: 21px;
  font-weight: 900;
}

.online {
  font-size: 12px;
  color: #10a58f;
}

/* MAIN */

.main {
  flex: 1;
  min-height: 0;
  display: flex;
}

/* USERS */

.users-panel {
  width: 270px;
  background: white;
  border-right: 1px solid #dce9e6;
  padding: 18px;
  overflow-y: auto;
}

.users-title {
  font-weight: 900;
  margin-bottom: 15px;
}

.user-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: 14px;
  margin-bottom: 8px;
}

.user-card:hover {
  background: #eefaf7;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #10bfa3;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  flex-shrink: 0;
}

.user-info {
  min-width: 0;
}

.user-name {
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.user-status {
  font-size: 11px;
  color: #7b8b88;
}

/* CHAT */

.chat {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.chat-header {
  background: white;
  border-bottom: 1px solid #dce9e6;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.room-name {
  font-weight: 900;
}

.call-buttons {
  display: flex;
  gap: 8px;
}

.icon-btn {
  border: 0;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: #eefaf7;
  font-size: 19px;
}

.icon-btn:hover {
  background: #d9f6f0;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  max-width: 75%;
  margin-bottom: 12px;
}

.message.mine {
  margin-left: auto;
}

.message-bubble {
  background: white;
  border-radius: 17px;
  padding: 11px 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

.message.mine .message-bubble {
  background: #10bfa3;
  color: white;
}

.message-name {
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 4px;
  opacity: .75;
}

.message-time {
  font-size: 9px;
  opacity: .55;
  margin-top: 4px;
}

/* TYPING */

.typing {
  height: 22px;
  padding-left: 20px;
  font-size: 12px;
  color: #7c8c89;
}

/* INPUT */

.composer {
  background: white;
  border-top: 1px solid #dce9e6;
  padding: 12px;
  display: flex;
  gap: 8px;
}

.composer input {
  flex: 1;
  min-width: 0;
  border: 1px solid #d8e6e3;
  border-radius: 14px;
  padding: 13px;
  outline: none;
}

.composer button {
  border: 0;
  width: 48px;
  border-radius: 14px;
  background: #10bfa3;
  color: white;
  font-size: 19px;
}

/* =========================
   CALL MODAL
========================= */

#callModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.82);
  z-index: 100;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.call-window {
  width: 100%;
  max-width: 900px;
  height: 80vh;
  background: #101716;
  border-radius: 25px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.video-grid {
  flex: 1;
  padding: 12px;
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
  overflow: auto;
}

.video-box {
  position: relative;
  background: #1b2523;
  border-radius: 16px;
  min-height: 180px;
  overflow: hidden;
}

.video-box video {
  width: 100%;
  height: 100%;
  min-height: 180px;
  object-fit: cover;
}

.video-name {
  position: absolute;
  left: 10px;
  bottom: 10px;
  color: white;
  background: rgba(0,0,0,.55);
  padding: 5px 8px;
  border-radius: 8px;
  font-size: 12px;
}

.call-controls {
  background: #111917;
  padding: 15px;
  display: flex;
  justify-content: center;
  gap: 10px;
}

.call-control {
  border: 0;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #26322f;
  color: white;
  font-size: 20px;
}

.call-control.end {
  background: #e54848;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

  .users-panel {
    display: none;
  }

  .topbar {
    padding: 0 12px;
  }

  .message {
    max-width: 88%;
  }

  .call-window {
    height: 92vh;
  }
}

</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginPage">

  <div class="login-card">

    <div class="logo">Z</div>

    <h1>ZIQVONA</h1>

    <div class="tagline">
      GOOD MUSIC • BETTER VIBES • ONE FAMILY
    </div>

    <input
      id="nameInput"
      type="text"
      placeholder="Your name"
      maxlength="30"
    >

    <input
      id="roomInput"
      type="text"
      placeholder="Room name"
      value="ziqvona"
      maxlength="40"
    >

    <button
      class="primary-btn"
      id="joinBtn"
    >
      Enter ZIQVONA
    </button>

  </div>

</section>


<!-- =========================
     APP
========================= -->

<section id="app" class="hidden">

  <header class="topbar">

    <div class="brand">

      <div class="brand-logo">Z</div>

      <div>
        <div class="brand-name">ZIQVONA</div>
        <div class="online" id="connectionStatus">
          Connecting...
        </div>
      </div>

    </div>

    <button
      class="icon-btn"
      id="logoutBtn"
      title="Logout"
    >
      ⎋
    </button>

  </header>


  <main class="main">

    <!-- USERS -->

    <aside class="users-panel">

      <div class="users-title">
        People in room
      </div>

      <div id="usersList"></div>

    </aside>


    <!-- CHAT -->

    <section class="chat">

      <div class="chat-header">

        <div>

          <div class="room-name">
            ZIQVONA Room
          </div>

          <div
            id="roomCounter"
            class="online"
          >
            0 people
          </div>

        </div>

        <div class="call-buttons">

          <button
            class="icon-btn"
            id="voiceCallBtn"
            title="Voice call"
          >
            📞
          </button>

          <button
            class="icon-btn"
            id="videoCallBtn"
            title="Video call"
          >
            📹
          </button>

          <button
            class="icon-btn"
            id="groupCallBtn"
            title="Group video call"
          >
            👥
          </button>

        </div>

      </div>


      <div
        id="messages"
        class="messages"
      ></div>


      <div
        id="typing"
        class="typing"
      ></div>


      <form
        id="composer"
        class="composer"
      >

        <input
          id="messageInput"
          type="text"
          placeholder="Write a message..."
          autocomplete="off"
        >

        <button
          type="button"
          id="emojiBtn"
        >
          😊
        </button>

        <button type="submit">
          ➤
        </button>

      </form>

    </section>

  </main>

</section>


<!-- =========================
     CALL
========================= -->

<div
  id="callModal"
  class="hidden"
>

  <div class="call-window">

    <div
      id="videoGrid"
      class="video-grid"
    ></div>

    <div class="call-controls">

      <button
        id="muteBtn"
        class="call-control"
      >
        🎤
      </button>

      <button
        id="cameraBtn"
        class="call-control"
      >
        📹
      </button>

      <button
        id="endCallBtn"
        class="call-control end"
      >
        ☎
      </button>

    </div>

  </div>

</div>


<script>

"use strict";

/* =========================
   SOCKET
========================= */

const socket = io({
  transports: ["websocket", "polling"]
});


/* =========================
   STATE
========================= */

let myName = "";
let roomId = "";
let myId = "";

let users = [];

let localStream = null;

const peers = new Map();

let callType = "video";
let inCall = false;


/* =========================
   ELEMENTS
========================= */

const loginPage =
  document.getElementById("loginPage");

const app =
  document.getElementById("app");

const nameInput =
  document.getElementById("nameInput");

const roomInput =
  document.getElementById("roomInput");

const joinBtn =
  document.getElementById("joinBtn");

const usersList =
  document.getElementById("usersList");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const composer =
  document.getElementById("composer");

const typing =
  document.getElementById("typing");

const connectionStatus =
  document.getElementById("connectionStatus");

const roomCounter =
  document.getElementById("roomCounter");

const callModal =
  document.getElementById("callModal");

const videoGrid =
  document.getElementById("videoGrid");

const voiceCallBtn =
  document.getElementById("voiceCallBtn");

const videoCallBtn =
  document.getElementById("videoCallBtn");

const groupCallBtn =
  document.getElementById("groupCallBtn");

const endCallBtn =
  document.getElementById("endCallBtn");

const muteBtn =
  document.getElementById("muteBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const emojiBtn =
  document.getElementById("emojiBtn");

const logoutBtn =
  document.getElementById("logoutBtn");


/* =========================
   CONNECTION
========================= */

socket.on("connect", () => {

  myId = socket.id;

  connectionStatus.textContent =
    "Connected";

  connectionStatus.style.color =
    "#10a58f";

});


socket.on("disconnect", () => {

  connectionStatus.textContent =
    "Disconnected";

  connectionStatus.style.color =
    "#e54848";

});


/* =========================
   JOIN
========================= */

joinBtn.addEventListener("click", joinRoom);

nameInput.addEventListener("keydown", (e) => {

  if (e.key === "Enter") {
    joinRoom();
  }

});


roomInput.addEventListener("keydown", (e) => {

  if (e.key === "Enter") {
    joinRoom();
  }

});


function joinRoom() {

  const name =
    nameInput.value.trim();

  const room =
    roomInput.value.trim();

  if (!name) {

    alert("Please enter your name.");

    nameInput.focus();

    return;
  }

  if (!room) {

    alert("Please enter a room name.");

    roomInput.focus();

    return;
  }

  myName = name;
  roomId = room;

  localStorage.setItem(
    "ziqvonaName",
    myName
  );

  localStorage.setItem(
    "ziqvonaRoom",
    roomId
  );

  loginPage.classList.add("hidden");

  app.classList.remove("hidden");

  socket.emit("join-room", {

    roomId,
    name: myName,
    avatar: "",
    status: "Online"

  });

  messageInput.focus();

}


/* =========================
   RESTORE LOGIN
========================= */

window.addEventListener("load", () => {

  const savedName =
    localStorage.getItem("ziqvonaName");

  const savedRoom =
    localStorage.getItem("ziqvonaRoom");

  if (savedName) {
    nameInput.value = savedName;
  }

  if (savedRoom) {
    roomInput.value = savedRoom;
  }

});


/* =========================
   USERS
========================= */

socket.on("room-users", (data) => {

  users = data.users || [];

  renderUsers();

});


socket.on("users-updated", (data) => {

  users = data.users || [];

  renderUsers();

});


socket.on("user-joined", (user) => {

  addSystemMessage(
    `${user.name} joined the room.`
  );

});


socket.on("user-left", (user) => {

  addSystemMessage(
    `${user.name} left the room.`
  );

});


function renderUsers() {

  usersList.innerHTML = "";

  roomCounter.textContent =
    `${users.length} ${
      users.length === 1
        ? "person"
        : "people"
    }`;

  users.forEach((user) => {

    const item =
      document.createElement("div");

    item.className = "user-card";

    const avatar =
      document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
      (user.name || "U")
      .charAt(0)
      .toUpperCase();

    const info =
      document.createElement("div");

    info.className = "user-info";

    const name =
      document.createElement("div");

    name.className = "user-name";

    name.textContent =
      user.id === myId
        ? `${user.name} (You)`
        : user.name;

    const status =
      document.createElement("div");

    status.className = "user-status";

    status.textContent =
      user.status || "Online";

    info.appendChild(name);
    info.appendChild(status);

    item.appendChild(avatar);
    item.appendChild(info);

    usersList.appendChild(item);

  });

}


/* =========================
   CHAT
========================= */

composer.addEventListener(
  "submit",
  (event) => {

    event.preventDefault();

    sendMessage();

  }
);


function sendMessage() {

  const text =
    messageInput.value.trim();

  if (!text) return;

  socket.emit("chat-message", {

    text,
    senderName: myName

  });

  messageInput.value = "";

  socket.emit("stop-typing");

}


socket.on("chat-message", (message) => {

  addMessage(message);

});


function addMessage(message) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message" +
    (
      message.senderId === myId
        ? " mine"
        : ""
    );

  const bubble =
    document.createElement("div");

  bubble.className =
    "message-bubble";

  const name =
    document.createElement("div");

  name.className =
    "message-name";

  name.textContent =
    message.senderId === myId
      ? "You"
      : message.senderName;

  const text =
    document.createElement("div");

  text.textContent =
    message.text;

  const time =
    document.createElement("div");

  time.className =
    "message-time";

  time.textContent =
    new Date(message.time)
      .toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

  bubble.appendChild(name);
  bubble.appendChild(text);
  bubble.appendChild(time);

  wrapper.appendChild(bubble);

  messages.appendChild(wrapper);

  messages.scrollTop =
    messages.scrollHeight;

}


function addSystemMessage(text) {

  const item =
    document.createElement("div");

  item.style.textAlign =
    "center";

  item.style.fontSize =
    "12px";

  item.style.color =
    "#84918e";

  item.style.margin =
    "12px 0";

  item.textContent = text;

  messages.appendChild(item);

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================
   TYPING
========================= */

let typingTimer;

messageInput.addEventListener(
  "input",
  () => {

    socket.emit("typing");

    clearTimeout(typingTimer);

    typingTimer =
      setTimeout(() => {

        socket.emit("stop-typing");

      }, 1000);

  }
);


socket.on("typing", (data) => {

  typing.textContent =
    `${data.name} is typing...`;

});


socket.on("stop-typing", () => {

  typing.textContent = "";

});


/* =========================
   EMOJI
========================= */

emojiBtn.addEventListener(
  "click",
  () => {

    messageInput.value += " 😊";

    messageInput.focus();

  }
);


/* =========================
   WEBRTC CONFIG
========================= */

const rtcConfig = {

  iceServers: [

    {
      urls: "stun:stun.l.google.com:19302"
    },

    {
      urls: "stun:stun1.l.google.com:19302"
    }

  ]

};


/* =========================
   GET MEDIA
========================= */

async function getMedia(type) {

  const constraints =
    type === "voice"

      ? {
          audio: true,
          video: false
        }

      : {
          audio: true,
          video: true
        };

  try {

    localStream =
      await navigator.mediaDevices
        .getUserMedia(constraints);

    showLocalVideo();

    return true;

  } catch (error) {

    console.error(error);

    alert(
      "ZIQVONA needs permission for your microphone/camera."
    );

    return false;

  }

}


/* =========================
   LOCAL VIDEO
========================= */

function showLocalVideo() {

  let box =
    document.getElementById(
      "video-" + myId
    );

  if (!box) {

    box =
      document.createElement("div");

    box.className =
      "video-box";

    box.id =
      "video-" + myId;

    videoGrid.appendChild(box);

  }

  let video =
    box.querySelector("video");

  if (!video) {

    video =
      document.createElement("video");

    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;

    box.appendChild(video);

  }

  video.srcObject =
    localStream;

  let label =
    box.querySelector(".video-name");

  if (!label) {

    label =
      document.createElement("div");

    label.className =
      "video-name";

    box.appendChild(label);

  }

  label.textContent =
    myName + " (You)";

}


/* =========================
   PEER
========================= */

function createPeer(targetId) {

  if (peers.has(targetId)) {

    return peers.get(targetId);

  }

  const pc =
    new RTCPeerConnection(
      rtcConfig
    );

  if (localStream) {

    localStream
      .getTracks()
      .forEach((track) => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }

  pc.onicecandidate =
    (event) => {

      if (event.candidate) {

        socket.emit(
          "ice-candidate",
          {
            targetId,
            candidate:
              event.candidate
          }
        );

      }

    };


  pc.ontrack =
    (event) => {

      showRemoteVideo(
        targetId,
        event.streams[0]
      );

    };


  pc.onconnectionstatechange =
    () => {

      if (
        pc.connectionState ===
        "failed"
      ) {

        pc.restartIce();

      }

    };


  peers.set(
    targetId,
    pc
  );

  return pc;

}


/* =========================
   REMOTE VIDEO
========================= */

function showRemoteVideo(
  userId,
  stream
) {

  let box =
    document.getElementById(
      "video-" + userId
    );

  if (!box) {

    box =
      document.createElement("div");

    box.className =
      "video-box";

    box.id =
      "video-" + userId;

    videoGrid.appendChild(box);

  }

  let video =
    box.querySelector("video");

  if (!video) {

    video =
      document.createElement("video");

    video.autoplay = true;
    video.playsInline = true;

    box.appendChild(video);

  }

  video.srcObject =
    stream;

  const user =
    users.find(
      (u) => u.id === userId
    );

  let label =
    box.querySelector(".video-name");

  if (!label) {

    label =
      document.createElement("div");

    label.className =
      "video-name";

    box.appendChild(label);

  }

  label.textContent =
    user
      ? user.name
      : "ZIQVONA User";

}


/* =========================
   START CALL
========================= */

async function startCall(
  type,
  group = false
) {

  callType = type;

  const success =
    await getMedia(type);

  if (!success) return;

  inCall = true;

  callModal.classList.remove(
    "hidden"
  );

  if (group) {

    socket.emit(
      "group-call-start",
      {
        callType:
          type === "voice"
            ? "voice"
            : "video"
      }
    );

    // Existing users will be contacted
    const others =
      users.filter(
        (u) => u.id !== myId
      );

    for (const user of others) {

      await createOffer(
        user.id
      );

    }

  } else {

    const target =
      users.find(
        (u) => u.id !== myId
      );

    if (!target) {

      alert(
        "There is no other user in this room yet."
      );

      endCall();

      return;

    }

    await createOffer(
      target.id
    );

  }

}


/* =========================
   CREATE OFFER
========================= */

async function createOffer(
  targetId
) {

  const pc =
    createPeer(targetId);

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  socket.emit(
    "call-user",
    {
      targetId,
      callType,
      offer
    }
  );

}


/* =========================
   INCOMING CALL
========================= */

socket.on(
  "incoming-call",
  async (data) => {

    const accepted =
      confirm(
        `${data.fromName} is calling you. Accept?`
      );

    if (!accepted) {

      return;

    }

    callType =
      data.callType || "video";

    const success =
      await getMedia(callType);

    if (!success) return;

    inCall = true;

    callModal.classList.remove(
      "hidden"
    );

    const pc =
      createPeer(data.from);

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    socket.emit(
      "accept-call",
      {
        targetId: data.from,
        answer
      }
    );

  }
);


/* =========================
   CALL ACCEPTED
========================= */

socket.on(
  "call-accepted",
  async (data) => {

    const pc =
      peers.get(data.from);

    if (!pc) return;

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

  }
);


/* =========================
   ICE
========================= */

socket.on(
  "ice-candidate",
  async (data) => {

    const pc =
      peers.get(data.from);

    if (!pc) return;

    try {

      await pc.addIceCandidate(
        new RTCIceCandidate(
          data.candidate
        )
      );

    } catch (error) {

      console.error(
        "ICE error:",
        error
      );

    }

  }
);


/* =========================
   GROUP CALL
========================= */

socket.on(
  "group-call-started",
  async (data) => {

    const accept =
      confirm(
        `${data.fromName} started a group call. Join?`
      );

    if (!accept) return;

    callType =
      data.callType || "video";

    const success =
      await getMedia(callType);

    if (!success) return;

    inCall = true;

    callModal.classList.remove(
      "hidden"
    );

    await createOffer(
      data.from
    );

  }
);


/* =========================
   END CALL
========================= */

endCallBtn.addEventListener(
  "click",
  endCall
);


function endCall() {

  inCall = false;

  peers.forEach(
    (pc) => pc.close()
  );

  peers.clear();

  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        (track) => track.stop()
      );

    localStream = null;

  }

  videoGrid.innerHTML = "";

  callModal.classList.add(
    "hidden"
  );

}


/* =========================
   REMOTE END
========================= */

socket.on(
  "call-ended",
  () => {

    endCall();

  }
);


/* =========================
   MUTE
========================= */

muteBtn.addEventListener(
  "click",
  () => {

    if (!localStream) return;

    const audioTracks =
      localStream.getAudioTracks();

    audioTracks.forEach(
      (track) => {

        track.enabled =
          !track.enabled;

      }
    );

    muteBtn.textContent =
      audioTracks[0] &&
      audioTracks[0].enabled
        ? "🎤"
        : "🔇";

  }
);


/* =========================
   CAMERA
========================= */

cameraBtn.addEventListener(
  "click",
  () => {

    if (!localStream) return;

    const tracks =
      localStream.getVideoTracks();

    tracks.forEach(
      (track) => {

        track.enabled =
          !track.enabled;

      }
    );

    cameraBtn.textContent =
      tracks[0] &&
      tracks[0].enabled
        ? "📹"
        : "🚫";

  }
);


/* =========================
   CALL BUTTONS
========================= */

voiceCallBtn.addEventListener(
  "click",
  () => {

    startCall(
      "voice",
      false
    );

  }
);


videoCallBtn.addEventListener(
  "click",
  () => {

    startCall(
      "video",
      false
    );

  }
);


groupCallBtn.addEventListener(
  "click",
  () => {

    startCall(
      "video",
      true
    );

  }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
  "click",
  () => {

    endCall();

    location.reload();

  }
);


/* =========================
   PROFILE
========================= */

socket.on(
  "reaction",
  (data) => {

    const reaction =
      document.createElement("div");

    reaction.textContent =
      data.emoji;

    reaction.style.position =
      "fixed";

    reaction.style.right =
      "25px";

    reaction.style.bottom =
      "100px";

    reaction.style.fontSize =
      "45px";

    reaction.style.zIndex =
      "500";

    document.body.appendChild(
      reaction
    );

    setTimeout(
      () => reaction.remove(),
      1800
    );

  }
);


/* =========================
   PAGE CLOSE
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    if (socket.connected) {

      socket.disconnect();

    }

  }
);

</script>

</body>
</html>
