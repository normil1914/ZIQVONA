<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#10bfa3">

<title>ZIQVONA — Room</title>

<style>
:root{
  --turq:#10bfa3;
  --turq-dark:#07977f;
  --bg:#f4f7f8;
  --panel:#ffffff;
  --line:#e6ecee;
  --text:#172126;
  --muted:#77838a;
  --bubble:#dcf8ef;
  --danger:#ef5350;
  --shadow:0 15px 45px rgba(19,43,50,.12);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top right,#d5fff6,transparent 40%),
    linear-gradient(135deg,#f7fffd,#eef5f4);
}

.login-card{
  width:min(430px,100%);
  background:white;
  border-radius:28px;
  padding:34px;
  box-shadow:var(--shadow);
  text-align:center;
}

.logo{
  width:76px;
  height:76px;
  border-radius:24px;
  background:linear-gradient(135deg,var(--turq),#087c6c);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:900;
  margin:0 auto 18px;
  box-shadow:0 12px 25px rgba(16,191,163,.25);
}

.login-card h1{
  margin:0;
  font-size:30px;
}

.login-card p{
  color:var(--muted);
  margin:8px 0 25px;
}

.login-card input{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  outline:none;
}

.login-card input:focus{
  border-color:var(--turq);
}

.primary{
  background:var(--turq);
  color:white;
  border-radius:14px;
  padding:14px 18px;
  font-weight:800;
}

.primary:hover{
  background:var(--turq-dark);
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100%;
  display:flex;
  overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:370px;
  min-width:370px;
  background:#fff;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
}

.side-top{
  padding:18px;
  border-bottom:1px solid var(--line);
}

.brand-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:22px;
}

.brand-logo{
  width:38px;
  height:38px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  background:var(--turq);
  font-weight:900;
}

.profile-mini{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:15px;
  background:#f6faf9;
  cursor:pointer;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
  background:#dce9e7;
}

.avatar-logo{
  width:45px;
  height:45px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--turq),#087c6c);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  flex-shrink:0;
}

.profile-mini-info{
  min-width:0;
}

.profile-mini-info strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile-mini-info small{
  color:var(--muted);
}

.search{
  margin-top:14px;
  position:relative;
}

.search input{
  width:100%;
  border:0;
  background:#f2f6f6;
  border-radius:14px;
  padding:13px 15px;
  outline:none;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:13px;
}

.tabs button{
  padding:10px 5px;
  background:#f1f5f5;
  color:#6c797e;
  border-radius:11px;
  font-size:13px;
  font-weight:800;
}

.tabs button.active{
  background:var(--turq);
  color:white;
}

.people-list{
  flex:1;
  overflow:auto;
  padding:8px;
}

.person{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px;
  border-radius:16px;
  background:white;
  text-align:left;
  margin-bottom:3px;
}

.person:hover{
  background:#f4f9f8;
}

.person.active{
  background:#e7faf5;
}

.person-info{
  flex:1;
  min-width:0;
}

.person-name{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.person-status{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.online-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#b9c2c5;
}

.online-dot.online{
  background:#17c77a;
}

.person-remove{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#fff0f0;
  color:var(--danger);
  font-size:15px;
}

.person-add{
  padding:7px 10px;
  border-radius:9px;
  background:#e7faf5;
  color:var(--turq-dark);
  font-weight:800;
  font-size:12px;
}

/* =========================
   CHAT
========================= */

.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 20% 20%,rgba(16,191,163,.05),transparent 25%),
    #f4f8f8;
}

.chat-empty{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  text-align:center;
  padding:30px;
}

.chat-empty .logo{
  margin-bottom:15px;
}

.chat-header{
  height:76px;
  min-height:76px;
  background:white;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 18px;
}

.chat-user{
  flex:1;
  min-width:0;
}

.chat-user strong{
  display:block;
  font-size:16px;
}

.chat-user small{
  color:var(--muted);
}

.header-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#f2f6f6;
  color:#526066;
  font-size:18px;
}

.icon-btn:hover{
  background:#e6f7f3;
  color:var(--turq-dark);
}

.messages{
  flex:1;
  overflow:auto;
  padding:24px 5%;
}

.message-row{
  display:flex;
  margin:5px 0;
}

.message-row.me{
  justify-content:flex-end;
}

.message{
  max-width:min(72%,520px);
  padding:10px 12px;
  border-radius:17px;
  background:white;
  box-shadow:0 3px 12px rgba(0,0,0,.035);
}

.message-row.me .message{
  background:var(--bubble);
}

.message-text{
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.4;
}

.message img{
  max-width:300px;
  max-height:350px;
  display:block;
  border-radius:13px;
  cursor:pointer;
}

.message-time{
  font-size:10px;
  color:#899397;
  margin-top:4px;
  text-align:right;
}

.composer{
  padding:12px 18px;
  background:white;
  border-top:1px solid var(--line);
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.composer textarea{
  flex:1;
  min-height:44px;
  max-height:120px;
  resize:none;
  border:0;
  background:#f2f6f6;
  border-radius:15px;
  padding:12px 14px;
  outline:none;
}

.send-btn{
  width:46px;
  height:46px;
  border-radius:14px;
  background:var(--turq);
  color:white;
  font-size:19px;
}

/* =========================
   EMOJI
========================= */

.emoji-panel{
  position:absolute;
  bottom:70px;
  left:15px;
  width:min(340px,90vw);
  background:white;
  border-radius:18px;
  padding:12px;
  box-shadow:var(--shadow);
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:5px;
  z-index:20;
}

.emoji-panel button{
  background:white;
  font-size:23px;
  padding:6px;
  border-radius:8px;
}

.emoji-panel button:hover{
  background:#eef7f5;
}

/* =========================
   CALL
========================= */

#callOverlay{
  position:fixed;
  inset:0;
  background:rgba(8,22,25,.86);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
}

.call-window{
  width:min(900px,94vw);
  height:min(720px,92vh);
  background:#101b1e;
  border-radius:28px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.call-top{
  height:70px;
  display:flex;
  align-items:center;
  padding:15px 20px;
  color:white;
  position:relative;
  z-index:4;
}

.call-person{
  display:flex;
  align-items:center;
  gap:10px;
}

.call-person .avatar-logo,
.call-person .avatar{
  width:42px;
  height:42px;
}

.call-video-area{
  flex:1;
  position:relative;
  background:#081013;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#081013;
}

#localVideo{
  position:absolute;
  width:170px;
  height:230px;
  right:18px;
  bottom:18px;
  object-fit:cover;
  border-radius:17px;
  border:2px solid rgba(255,255,255,.4);
  z-index:5;
  background:#111;
}

.call-placeholder{
  color:white;
  text-align:center;
}

.call-placeholder .avatar-logo{
  width:90px;
  height:90px;
  margin:auto auto 15px;
  font-size:34px;
}

.call-controls{
  min-height:88px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  background:#101b1e;
}

.call-control{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#26373b;
  color:white;
  font-size:20px;
}

.call-control.end{
  background:#e84949;
}

.call-control:hover{
  transform:scale(1.04);
}

.incoming-card{
  width:min(400px,90vw);
  background:white;
  border-radius:25px;
  padding:30px;
  text-align:center;
  box-shadow:var(--shadow);
}

.incoming-card .avatar-logo,
.incoming-card .avatar{
  width:90px;
  height:90px;
  margin:auto;
}

.incoming-card h2{
  margin:14px 0 4px;
}

.incoming-card p{
  color:var(--muted);
}

.incoming-actions{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.incoming-actions button{
  flex:1;
  padding:14px;
  border-radius:13px;
  font-weight:800;
}

.reject{
  background:#ffeaea;
  color:#d83d3d;
}

.accept{
  background:var(--turq);
  color:white;
}

/* =========================
   PROFILE
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  z-index:80;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-card{
  width:min(450px,100%);
  background:white;
  border-radius:25px;
  padding:25px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:800;
}

.form-group input,
.form-group textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  outline:none;
}

.profile-preview{
  display:flex;
  justify-content:center;
  margin-bottom:15px;
}

.profile-preview .avatar,
.profile-preview .avatar-logo{
  width:100px;
  height:100px;
  font-size:34px;
}

/* =========================
   LIGHTBOX
========================= */

#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

#lightbox img{
  max-width:95%;
  max-height:90%;
  border-radius:12px;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#172126;
  color:white;
  padding:12px 17px;
  border-radius:13px;
  z-index:500;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

#toast.show{
  opacity:1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

  .sidebar{
    width:100%;
    min-width:0;
  }

  .chat{
    position:fixed;
    inset:0;
    z-index:40;
    transform:translateX(100%);
    transition:.25s;
  }

  .chat.open{
    transform:translateX(0);
  }

  .sidebar.hidden-mobile{
    display:none;
  }

  .mobile-back{
    display:block!important;
  }

  .messages{
    padding:18px 12px;
  }

  .message{
    max-width:86%;
  }

  #localVideo{
    width:105px;
    height:145px;
    right:10px;
    bottom:10px;
  }

  .call-window{
    width:100%;
    height:100%;
    border-radius:0;
  }
}

.mobile-back{
  display:none;
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginPage">

  <div class="login-card">

    <div class="logo">Z</div>

    <h1>ZIQVONA</h1>

    <p>
      Connecte. Pale. Pataje.
      Rete pi pre moun ou renmen yo.
    </p>

    <input
      id="loginUsername"
      maxlength="32"
      placeholder="Antre non itilizatè ou"
      autocomplete="username"
    >

    <br><br>

    <button
      class="primary"
      id="loginBtn"
      style="width:100%"
    >
      Konekte sou ZIQVONA
    </button>

  </div>

</section>

<!-- =========================
     APP
========================= -->

<section id="app" class="hidden">

  <aside class="sidebar" id="sidebar">

    <div class="side-top">

      <div class="brand-row">

        <div class="brand">
          <div class="brand-logo">Z</div>
          ZIQVONA
        </div>

        <button
          class="icon-btn"
          id="profileBtn"
          title="Pwofil"
        >
          👤
        </button>

      </div>

      <div
        class="profile-mini"
        id="profileMini"
      >
        <div id="myAvatar"></div>

        <div class="profile-mini-info">
          <strong id="myName">ZIQVONA</strong>
          <small id="myStatus">Disponib</small>
        </div>
      </div>

      <div class="search">
        <input
          id="searchInput"
          placeholder="🔎 Chèche yon moun..."
        >
      </div>

      <div class="tabs">

        <button
          class="active"
          data-view="contacts"
        >
          Kontak
        </button>

        <button
          data-view="people"
        >
          Moun
        </button>

        <button
          data-view="online"
        >
          Online
        </button>

      </div>

    </div>

    <div
      class="people-list"
      id="peopleList"
    ></div>

  </aside>

  <!-- CHAT -->

  <main class="chat" id="chat">

    <div
      class="chat-empty"
      id="chatEmpty"
    >

      <div class="logo">Z</div>

      <h2>Byenvini sou ZIQVONA</h2>

      <p>
        Chwazi yon moun pou kòmanse yon konvèsasyon prive.
      </p>

    </div>

    <div
      id="chatContent"
      class="hidden"
      style="height:100%;display:flex;flex-direction:column"
    >

      <header class="chat-header">

        <button
          class="icon-btn mobile-back"
          id="mobileBack"
        >
          ←
        </button>

        <div id="chatAvatar"></div>

        <div class="chat-user">
          <strong id="chatName">---</strong>
          <small id="chatStatus">---</small>
        </div>

        <div class="header-actions">

          <button
            class="icon-btn"
            id="audioCallBtn"
            title="Apèl vwa"
          >
            📞
          </button>

          <button
            class="icon-btn"
            id="videoCallBtn"
            title="Apèl video"
          >
            🎥
          </button>

          <button
            class="icon-btn"
            id="removeContactBtn"
            title="Retire kontak"
          >
            🗑️
          </button>

        </div>

      </header>

      <div
        class="messages"
        id="messages"
      ></div>

      <div
        style="position:relative"
      >

        <div
          id="emojiPanel"
          class="emoji-panel hidden"
        ></div>

        <div class="composer">

          <button
            class="icon-btn"
            id="emojiBtn"
            title="Emoji"
          >
            😊
          </button>

          <button
            class="icon-btn"
            id="photoBtn"
            title="Voye foto"
          >
            📷
          </button>

          <input
            id="photoInput"
            type="file"
            accept="image/*"
            class="hidden"
          >

          <textarea
            id="messageInput"
            rows="1"
            maxlength="4000"
            placeholder="Ekri yon mesaj..."
          ></textarea>

          <button
            class="send-btn"
            id="sendBtn"
          >
            ➤
          </button>

        </div>

      </div>

    </div>

  </main>

</section>

<!-- =========================
     PROFILE MODAL
========================= -->

<div
  id="profileModal"
  class="modal hidden"
>

  <div class="modal-card">

    <div class="modal-head">

      <h2>Pwofil mwen</h2>

      <button
        class="icon-btn"
        id="closeProfile"
      >
        ✕
      </button>

    </div>

    <div class="profile-preview">
      <div id="profilePreviewAvatar"></div>
    </div>

    <div class="form-group">
      <label>Foto pwofil</label>

      <input
        id="avatarInput"
        type="file"
        accept="image/*"
      >
    </div>

    <div class="form-group">

      <label>Non</label>

      <input
        id="profileName"
        maxlength="32"
      >

    </div>

    <div class="form-group">

      <label>Status</label>

      <textarea
        id="profileStatus"
        maxlength="120"
        rows="3"
        placeholder="Ekri yon ti status..."
      ></textarea>

    </div>

    <button
      class="primary"
      id="saveProfile"
      style="width:100%"
    >
      Sove pwofil
    </button>

  </div>

</div>

<!-- =========================
     CALL OVERLAY
========================= -->

<div
  id="callOverlay"
  class="hidden"
>

  <div
    id="incomingCall"
    class="incoming-card hidden"
  >

    <div id="incomingAvatar"></div>

    <h2 id="incomingName">Apèl...</h2>

    <p id="incomingType">
      Apèl vwa ap vini
    </p>

    <div class="incoming-actions">

      <button
        class="reject"
        id="rejectCall"
      >
        Refize
      </button>

      <button
        class="accept"
        id="acceptCall"
      >
        Aksepte
      </button>

    </div>

  </div>

  <div
    id="callWindow"
    class="call-window hidden"
  >

    <div class="call-top">

      <div class="call-person">

        <div id="callAvatar"></div>

        <div>
          <strong id="callName">---</strong>
          <div
            id="callStatus"
            style="font-size:12px;color:#9eafb2"
          >
            Koneksyon...
          </div>
        </div>

      </div>

    </div>

    <div class="call-video-area">

      <div
        class="call-placeholder"
        id="callPlaceholder"
      >
        <div id="callBigAvatar"></div>
        <div>Apèl ap konekte...</div>
      </div>

      <video
        id="remoteVideo"
        autoplay
        playsinline
      ></video>

      <video
        id="localVideo"
        autoplay
        muted
        playsinline
      ></video>

      <audio
        id="remoteAudio"
        autoplay
      ></audio>

    </div>

    <div class="call-controls">

      <button
        class="call-control"
        id="muteBtn"
        title="Mute"
      >
        🎙️

function compressImage(
  file,
  maxSize,
  quality
){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload = () => {

        const img =
          new Image();

        img.onload = () => {

          let width =
            img.naturalWidth;

          let height =
            img.naturalHeight;

          if(
            width > maxSize ||
            height > maxSize
          ){

            const scale =
              Math.min(
                maxSize / width,
                maxSize / height
              );

            width =
              Math.round(width * scale);

            height =
              Math.round(height * scale);

          }

          const canvas =
            document.createElement("canvas");

          canvas.width = width;
          canvas.height = height;

          const ctx =
            canvas.getContext("2d");

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };

        img.onerror =
          () => reject(
            new Error("Invalid image")
          );

        img.src =
          reader.result;
      };

      reader.onerror =
        () => reject(
          new Error("File error")
        );

      reader.readAsDataURL(file);
    }
  );
}

    data.callId;

  callStatus.textContent =
    "Ap tann moun nan aksepte...";

});

/* =========================
   INCOMING CALL
========================= */

socket.on("call:incoming",data => {

  const caller =
    allUsers.find(
      u => u.username === data.from
    ) || {
      username:data.from,
      displayName:data.from,
      avatar:"",
      online:true
    };

  pendingIncomingCall = {
    callId:data.callId,
    from:data.from,
    type:data.type
  };

  currentCall = {
    callId:data.callId,
    with:data.from,
    type:data.type,
    role:"callee"
  };

  setupCallPerson(caller);

  setAvatar(
    incomingAvatar,
    caller
  );

  incomingName.textContent =
    caller.displayName ||
    caller.username;

  incomingType.textContent =
    data.type === "video"
      ? "🎥 Apèl video ap vini..."
      : "📞 Apèl vwa ap vini...";

  showCallOverlay();
  showIncoming();

});

/* =========================
   ACCEPT CALL
========================= */

acceptCall.addEventListener(
  "click",
  async () => {

    if(!pendingIncomingCall) return;

    try{

      const call =
        pendingIncomingCall;

      const user =
        allUsers.find(
          u => u.username === call.from
        ) || {
          username:call.from,
          displayName:call.from,
          avatar:""
        };

      await getLocalMedia(
        call.type
      );

      currentCall = {
        callId:call.callId,
        with:call.from,
        type:call.type,
        role:"callee"
      };

      setupCallPerson(user);

      showCallOverlay();
      showCallWindow();

      if(call.type === "audio"){

        remoteVideo.style.display =
          "none";

        localVideo.style.display =
          "none";

      }else{

        remoteVideo.style.display =
          "block";

        localVideo.style.display =
          "block";

      }

      callStatus.textContent =
        "Apèl aksepte. Koneksyon...";

      socket.emit("call:accept",{
        callId:call.callId
      });

      pendingIncomingCall = null;

    }catch(error){

      console.error(error);

      showToast(
        "Nou pa kapab aktive mikwo/kamera a."
      );

      socket.emit("call:reject",{
        callId:pendingIncomingCall.callId
      });

      cleanupCall(false);

    }

  }
);

/* =========================
   REJECT CALL
========================= */

rejectCall.addEventListener(
  "click",
  () => {

    if(!pendingIncomingCall) return;

    socket.emit("call:reject",{
      callId:
        pendingIncomingCall.callId
    });

    pendingIncomingCall = null;

    cleanupCall(false);

  }
);

/* =========================
   CALL ACCEPTED
========================= */

socket.on("call:accepted",async data => {

  if(
    !currentCall ||
    currentCall.callId !== data.callId
  ){
    return;
  }

  callStatus.textContent =
    "Kreye koneksyon...";

  try{

    await createPeerConnection();

    addLocalTracks();

    const offer =
      await peerConnection.createOffer();

    await peerConnection.setLocalDescription(
      offer
    );

    socket.emit("webrtc:offer",{
      callId:data.callId,
      offer:peerConnection.localDescription
    });

    callStatus.textContent =
      "Ap konekte...";

  }catch(error){

    console.error(error);

    showToast(
      "Erè pandan koneksyon apèl la."
    );

  }

});

/* =========================
   PEER CONNECTION
========================= */

async function createPeerConnection(){

  if(peerConnection){

    try{
      peerConnection.close();
    }catch{}

  }

  pendingIceCandidates = [];

  peerConnection =
    new RTCPeerConnection({
      iceServers
    });

  peerConnection.onicecandidate =
    event => {

      if(
        event.candidate &&
        currentCall
      ){

        socket.emit(
          "webrtc:ice-candidate",
          {
            callId:
              currentCall.callId,
            candidate:
              event.candidate
          }
        );

      }

    };

  peerConnection.ontrack =
    event => {

      if(!remoteStream){

        remoteStream =
          new MediaStream();

      }

      event.streams[0]
        ?.getTracks()
        .forEach(track => {

          const exists =
            remoteStream
              .getTracks()
              .some(
                t => t.id === track.id
              );

          if(!exists){

            remoteStream.addTrack(
              track
            );

          }

        });

      remoteVideo.srcObject =
        remoteStream;

      remoteAudio.srcObject =
        remoteStream;

      remoteVideo.play()
        .catch(()=>{});

      remoteAudio.play()
        .catch(()=>{});

      callPlaceholder.classList.add(
        "hidden"
      );

      callStatus.textContent =
        "Konekte";

    };

  peerConnection.onconnectionstatechange =
    () => {

      if(!peerConnection) return;

      const state =
        peerConnection.connectionState;

      if(state === "connected"){

        callStatus.textContent =
          "Konekte";

      }else if(state === "connecting"){

        callStatus.textContent =
          "Konekte...";

      }else if(
        state === "disconnected"
      ){

        callStatus.textContent =
          "Koneksyon pèdi...";

      }else if(state === "failed"){

        callStatus.textContent =
          "Koneksyon echwe";

        showToast(
          turnConfigured
            ? "Koneksyon apèl la echwe."
            : "TURN pa configure. Mete TURN nan Render pou apèl atravè diferan rezo."
        );

      }

    };

  peerConnection.oniceconnectionstatechange =
    () => {

      if(!peerConnection) return;

      if(
        peerConnection.iceConnectionState ===
        "failed"
      ){

        console.warn(
          "ICE connection failed"
        );

      }

    };

}

function addLocalTracks(){

  if(
    !peerConnection ||
    !localStream
  ){
    return;
  }

  const existing =
    peerConnection
      .getSenders()
      .map(sender => sender.track)
      .filter(Boolean);

  localStream
    .getTracks()
    .forEach(track => {

      if(!existing.includes(track)){

        peerConnection.addTrack(
          track,
          localStream
        );

      }

    });

}

/* =========================
   GET LOCAL MEDIA
========================= */

async function getLocalMedia(type){

  stopLocalStream();

  localStream =
    await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:type === "video"
    });

  localVideo.srcObject =
    localStream;

  localVideo.muted = true;

  localVideo.play()
    .catch(()=>{});

  isMuted = false;
  isCameraOff = false;

  muteBtn.textContent =
    "🎙️";

  cameraBtn.textContent =
    "🎥";

}

/* =========================
   WEBRTC OFFER
========================= */

socket.on("webrtc:offer",async data => {

  if(
    !currentCall ||
    currentCall.callId !== data.callId
  ){
    return;
  }

  try{

    if(!peerConnection){

      await createPeerConnection();

      addLocalTracks();

    }

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );

    await flushIceCandidates();

    const answer =
      await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(
      answer
    );

    socket.emit("webrtc:answer",{
      callId:data.callId,
      answer:peerConnection.localDescription
    });

    callStatus.textContent =
      "Apèl ap konekte...";

  }catch(error){

    console.error(
      "Offer error:",
      error
    );

  }

});

/* =========================
   WEBRTC ANSWER
========================= */

socket.on("webrtc:answer",async data => {

  if(
    !currentCall ||
    currentCall.callId !== data.callId ||
    !peerConnection
  ){
    return;
  }

  try{

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

    await flushIceCandidates();

  }catch(error){

    console.error(
      "Answer error:",
      error
    );

  }

});

/* =========================
   ICE
========================= */

socket.on(
  "webrtc:ice-candidate",
  async data => {

    if(
      !currentCall ||
      currentCall.callId !== data.callId
    ){
      return;
    }

    if(
      !peerConnection ||
      !peerConnection.remoteDescription
    ){

      pendingIceCandidates.push(
        data.candidate
      );

      return;

    }

    try{

      await peerConnection.addIceCandidate(
        new RTCIceCandidate(
          data.candidate
        )
      );

    }catch(error){

      console.warn(
        "ICE candidate error:",
        error
      );

    }

  }
);

async function flushIceCandidates(){

  if(!peerConnection) return;

  const list =
    pendingIceCandidates;

  pendingIceCandidates = [];

  for(const candidate of list){

    try{

      await peerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
      );

    }catch(error){

      console.warn(
        "ICE queue error:",
        error
      );

    }

  }

}

/* =========================
   MUTE
========================= */

muteBtn.addEventListener(
  "click",
  () => {

    if(!localStream) return;

    const tracks =
      localStream.getAudioTracks();

    if(!tracks.length) return;

    isMuted = !isMuted;

    tracks.forEach(
      track =>
        track.enabled = !isMuted
    );

    muteBtn.textContent =
      isMuted
        ? "🔇"
        : "🎙️";

  }
);

/* =========================
   CAMERA
========================= */

cameraBtn.addEventListener(
  "click",
  () => {

    if(!localStream) return;

    const tracks =
      localStream.getVideoTracks();

    if(!tracks.length) return;

    isCameraOff =
      !isCameraOff;

    tracks.forEach(
      track =>
        track.enabled = !isCameraOff
    );

    cameraBtn.textContent =
      isCameraOff
        ? "🚫"
        : "🎥";

  }
);

/* =========================
   END CALL
========================= */

endCallBtn.addEventListener(
  "click",
  endCurrentCall
);

function endCurrentCall(){

  if(currentCall?.callId){

    socket.emit("call:end",{
      callId:
        currentCall.callId
    });

  }

  cleanupCall(true);

}

socket.on("call:rejected",data => {

  if(
    currentCall &&
    currentCall.callId === data.callId
  ){

    showToast(
      "Apèl la te refize."
    );

    cleanupCall(true);

  }

});

socket.on("call:ended",data => {

  if(
    currentCall &&
    currentCall.callId === data.callId
  ){

    showToast(
      "Apèl la fini."
    );

    cleanupCall(true);

  }

});

/* =========================
   CLEANUP CALL
========================= */

function stopLocalStream(){

  if(!localStream) return;

  localStream
    .getTracks()
    .forEach(
      track => track.stop()
    );

  localStream = null;

  localVideo.srcObject = null;

}

function cleanupCall(showToastMessage){

  try{

    if(peerConnection){

      peerConnection.ontrack = null;
      peerConnection.onicecandidate = null;

      peerConnection.close();

    }

  }catch{}

  peerConnection = null;

  stopLocalStream();

  remoteStream = null;

  remoteVideo.srcObject = null;
  remoteAudio.srcObject = null;

  pendingIceCandidates = [];

  currentCall = null;
  pendingIncomingCall = null;

  callOverlay.classList.add("hidden");
  incomingCall.classList.add("hidden");
  callWindow.classList.add("hidden");

  callPlaceholder.classList.remove(
    "hidden"
  );

  remoteVideo.style.display =
    "block";

  localVideo.style.display =
    "block";

  if(showToastMessage){

    showToast(
      "Apèl la fini."
    );

  }

}

/* =========================
   SOCKET ERRORS
========================= */

socket.on("message:error",data => {

  showToast(
    data.message ||
    "Mesaj la pa voye."
  );

});

socket.on("contact:error",data => {

  showToast(
    data.message ||
    "Kontak la pa disponib."
  );

});

socket.on("chat:error",data => {

  showToast(
    data.message ||
    "Chat la pa disponib."
  );

});

socket.on("call:error",data => {

  showToast(
    data.message ||
    "Apèl la pa kapab kòmanse."
  );

  cleanupCall(false);

});

/* =========================
   LIGHTBOX
========================= */

lightbox.addEventListener(
  "click",
  () => {

    lightbox.classList.add(
      "hidden"
    );

    lightboxImage.src = "";

  }
);

/* =========================
   UTILITIES
========================= */

function formatTime(timestamp){

  if(!timestamp) return "";

  return new Date(timestamp)
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}

function scrollMessages(){

  messages.scrollTop =
    messages.scrollHeight;

}

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

  return escapeHTML(value);

}

/* =========================
   CLOSE EMOJI WHEN CLICK OUTSIDE
========================= */

document.addEventListener(
  "click",
  e => {

    if(
      !emojiPanel.contains(e.target) &&
      e.target !== emojiBtn
    ){

      emojiPanel.classList.add(
        "hidden"
      );

    }

  }
);

/* =========================
   AUTO RESIZE TEXTAREA
========================= */

messageInput.addEventListener(
  "input",
  () => {

    messageInput.style.height =
      "44px";

    messageInput.style.height =
      Math.min(
        messageInput.scrollHeight,
        120
      ) + "px";

  }
);

/* =========================
   BEFORE UNLOAD
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    try{

      if(currentCall?.callId){

        socket.emit("call:end",{
          callId:
            currentCall.callId
        });

      }

    }catch{}

  }
);
</script>
