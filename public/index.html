<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#10bfa3"
>

<title>ZIQVONA</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #eefaf7;
  color: #102a27;
}

button,
input {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* LOGIN */

#loginPage {
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;

  background:
    linear-gradient(
      135deg,
      #10bfa3,
      #087f73
    );
}

.login-card {
  width: 100%;
  max-width: 430px;

  background: white;

  border-radius: 28px;

  padding: 35px 28px;

  text-align: center;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.18);
}

.logo {
  width: 82px;
  height: 82px;

  margin:
    0 auto 18px;

  border-radius: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #10bfa3;

  color: white;

  font-size: 40px;
  font-weight: 900;
}

.login-card h1 {
  margin: 0;
  font-size: 32px;
}

.tagline {
  margin:
    10px 0 25px;

  color: #71827f;

  font-size: 13px;

  letter-spacing: .5px;
}

.login-card input {
  width: 100%;

  padding: 15px;

  margin-bottom: 12px;

  border:
    1px solid #d8e6e3;

  border-radius: 14px;

  outline: none;

  font-size: 16px;
}

.login-card input:focus {
  border-color:
    #10bfa3;
}

.primary {
  width: 100%;

  border: 0;

  background: #10bfa3;

  color: white;

  padding: 15px;

  border-radius: 14px;

  font-size: 16px;

  font-weight: 800;
}


/* APP */

#app {
  height: 100vh;

  display: flex;
  flex-direction: column;
}


/* HEADER */

.header {
  height: 68px;

  background: white;

  border-bottom:
    1px solid #dce9e6;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    0 18px;

  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  width: 42px;
  height: 42px;

  border-radius: 13px;

  background: #10bfa3;

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: 900;
  font-size: 21px;
}

.brand-name {
  font-weight: 900;
  font-size: 20px;
}

.status {
  font-size: 11px;
  color: #10a58f;
}


/* BODY */

.body {
  flex: 1;

  min-height: 0;

  display: flex;
}


/* PEOPLE */

.people {
  width: 300px;

  background: white;

  border-right:
    1px solid #dce9e6;

  display: flex;
  flex-direction: column;

  flex-shrink: 0;
}

.people-header {
  padding: 18px;
}

.people-title {
  font-weight: 900;
  font-size: 18px;
}

.people-subtitle {
  color: #10a58f;

  font-size: 12px;

  margin-top: 4px;
}

.search {
  margin-top: 14px;

  width: 100%;

  padding: 11px 13px;

  border:
    1px solid #d8e6e3;

  border-radius: 12px;

  outline: none;
}

.people-list {
  flex: 1;

  overflow-y: auto;

  padding:
    0 10px 15px;
}

.person {
  display: flex;

  align-items: center;

  gap: 10px;

  padding: 10px;

  border-radius: 14px;

  margin-bottom: 5px;
}

.person:hover {
  background: #eefaf7;
}

.person.active {
  background: #dff8f3;
}

.avatar {
  width: 44px;
  height: 44px;

  border-radius: 50%;

  background: #10bfa3;

  color: white;

  display: flex;

  align-items: center;
  justify-content: center;

  font-weight: 900;

  position: relative;

  flex-shrink: 0;
}

.online-dot {
  width: 11px;
  height: 11px;

  border-radius: 50%;

  background: #20c878;

  border:
    2px solid white;

  position: absolute;

  right: -1px;
  bottom: 0;
}

.person-info {
  min-width: 0;
  flex: 1;
}

.person-name {
  font-weight: 800;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.person-status {
  font-size: 11px;

  color: #10a58f;

  margin-top: 3px;
}


/* CHAT */

.chat {
  flex: 1;

  min-width: 0;

  display: flex;
  flex-direction: column;
}

.chat-header {
  height: 67px;

  background: white;

  border-bottom:
    1px solid #dce9e6;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    0 18px;
}

.chat-user {
  display: flex;

  align-items: center;

  gap: 10px;
}

.chat-avatar {
  width: 40px;
  height: 40px;

  border-radius: 50%;

  background: #10bfa3;

  color: white;

  display: flex;

  align-items: center;
  justify-content: center;

  font-weight: 900;
}

.chat-name {
  font-weight: 900;
}

.chat-status {
  color: #10a58f;

  font-size: 11px;

  margin-top: 2px;
}

.chat-actions {
  display: flex;
  gap: 7px;
}

.icon {
  width: 42px;
  height: 42px;

  border: 0;

  border-radius: 12px;

  background: #eefaf7;

  font-size: 18px;
}

.icon:hover {
  background: #d9f6f0;
}


/* MESSAGES */

.messages {
  flex: 1;

  overflow-y: auto;

  padding: 20px;
}

.empty {
  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  color: #7b8b88;
}

.message {
  max-width: 75%;

  margin-bottom: 12px;
}

.message.mine {
  margin-left: auto;
}

.bubble {
  background: white;

  padding: 11px 14px;

  border-radius: 17px;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.05);
}

.message.mine .bubble {
  background: #10bfa3;
  color: white;
}

.sender {
  font-size: 10px;

  font-weight: 800;

  margin-bottom: 4px;

  opacity: .7;
}

.time {
  font-size: 9px;

  opacity: .55;

  margin-top: 4px;
}


/* COMPOSER */

.composer {
  background: white;

  border-top:
    1px solid #dce9e6;

  padding: 12px;

  display: flex;

  gap: 8px;
}

.composer input {
  flex: 1;

  min-width: 0;

  border:
    1px solid #d8e6e3;

  border-radius: 14px;

  padding: 13px;

  outline: none;
}

.send {
  width: 48px;

  border: 0;

  border-radius: 14px;

  background: #10bfa3;

  color: white;

  font-size: 18px;
}


/* MOBILE */

@media(max-width:750px) {

  .people {
    width: 100%;
  }

  .chat {
    display: none;
  }

  .people.mobile-chat-open {
    display: none;
  }

  .chat.mobile-visible {
    display: flex;
    width: 100%;
  }

}


/* CALL */

#callModal {
  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.84);

  z-index: 100;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 20px;
}

.call-box {
  width: 100%;
  max-width: 900px;

  height: 80vh;

  background: #101716;

  border-radius: 24px;

  overflow: hidden;

  display: flex;
  flex-direction: column;
}

.videos {
  flex: 1;

  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(220px,1fr)
    );

  gap: 10px;

  padding: 12px;

  overflow: auto;
}

.video {
  position: relative;

  background: #1b2523;

  border-radius: 16px;

  overflow: hidden;

  min-height: 180px;
}

.video video {
  width: 100%;
  height: 100%;

  min-height: 180px;

  object-fit: cover;
}

.video-label {
  position: absolute;

  left: 10px;
  bottom: 10px;

  color: white;

  background:
    rgba(0,0,0,.55);

  padding: 5px 8px;

  border-radius: 8px;

  font-size: 12px;
}

.controls {
  display: flex;

  justify-content: center;

  gap: 10px;

  padding: 15px;

  background: #111917;
}

.control {
  width: 52px;
  height: 52px;

  border: 0;

  border-radius: 50%;

  background: #26322f;

  color: white;

  font-size: 20px;
}

.end {
  background: #e54848;
}

</style>

</head>

<body>


<!-- LOGIN -->

<section id="loginPage">

  <div class="login-card">

    <div class="logo">
      Z
    </div>

    <h1>ZIQVONA</h1>

    <div class="tagline">
      GOOD MUSIC • BETTER VIBES • ONE FAMILY
    </div>

    <input
      id="nameInput"
      placeholder="Your name"
      maxlength="30"
    >

    <button
      id="joinBtn"
      class="primary"
    >
      Join ZIQVONA
    </button>

  </div>

</section>


<!-- APP -->

<section
  id="app"
  class="hidden"
>

<header class="header">

  <div class="brand">

    <div class="brand-logo">
      Z
    </div>

    <div>

      <div class="brand-name">
        ZIQVONA
      </div>

      <div
        id="connection"
        class="status"
      >
        Connecting...
      </div>

    </div>

  </div>

  <button
    id="logout"
    class="icon"
  >
    ⎋
  </button>

</header>


<div class="body">


<!-- PEOPLE -->

<aside class="people">

  <div class="people-header">

    <div class="people-title">
      Online People
    </div>

    <div
      id="onlineCount"
      class="people-subtitle"
    >
      0 online
    </div>

    <input
      id="search"
      class="search"
      placeholder="Search people..."
    >

  </div>

  <div
    id="peopleList"
    class="people-list"
  ></div>

</aside>


<!-- CHAT -->

<section
  id="chat"
  class="chat"
>

  <div class="chat-header">

    <div class="chat-user">

      <div
        id="chatAvatar"
        class="chat-avatar"
      >
        Z
      </div>

      <div>

        <div
          id="chatName"
          class="chat-name"
        >
          ZIQVONA Global Chat
        </div>

        <div
          id="chatStatus"
          class="chat-status"
        >
          Everyone
        </div>

      </div>

    </div>


    <div class="chat-actions">

      <button
        id="voiceBtn"
        class="icon"
        title="Voice call"
      >
        📞
      </button>

      <button
        id="videoBtn"
        class="icon"
        title="Video call"
      >
        📹
      </button>

    </div>

  </div>


  <div
    id="messages"
    class="messages"
  >

    <div class="empty">
      Select a person or use Global Chat.
    </div>

  </div>


  <form
    id="composer"
    class="composer"
  >

    <input
      id="messageInput"
      placeholder="Write a message..."
      autocomplete="off"
    >

    <button
      type="button"
      id="emoji"
      class="icon"
    >
      😊
    </button>

    <button
      type="submit"
      class="send"
    >
      ➤
    </button>

  </form>

</section>

</div>

</section>


<!-- CALL -->

<div
  id="callModal"
  class="hidden"
>

  <div class="call-box">

    <div
      id="videos"
      class="videos"
    ></div>

    <div class="controls">

      <button
        id="mute"
        class="control"
      >
        🎤
      </button>

      <button
        id="camera"
        class="control"
      >
        📹
      </button>

      <button
        id="endCall"
        class="control end"
      >
        ☎
      </button>

    </div>

  </div>

</div>


<script>

"use strict";


/* =================================
   SOCKET
================================= */

const socket =
  io({
    transports:
      ["websocket","polling"]
  });


/* =================================
   STATE
================================= */

let myId = "";
let myName = "";

let onlineUsers = [];

let selectedUser = null;

let globalChat = true;

let localStream = null;

const peers =
  new Map();


/* =================================
   ELEMENTS
================================= */

const loginPage =
  document.getElementById(
    "loginPage"
  );

const app =
  document.getElementById(
    "app"
  );

const nameInput =
  document.getElementById(
    "nameInput"
  );

const joinBtn =
  document.getElementById(
    "joinBtn"
  );

const peopleList =
  document.getElementById(
    "peopleList"
  );

const onlineCount =
  document.getElementById(
    "onlineCount"
  );

const search =
  document.getElementById(
    "search"
  );

const chatName =
  document.getElementById(
    "chatName"
  );

const chatStatus =
  document.getElementById(
    "chatStatus"
  );

const chatAvatar =
  document.getElementById(
    "chatAvatar"
  );

const messages =
  document.getElementById(
    "messages"
  );

const composer =
  document.getElementById(
    "composer"
  );

const messageInput =
  document.getElementById(
    "messageInput"
  );

const emoji =
  document.getElementById(
    "emoji"
  );

const connection =
  document.getElementById(
    "connection"
  );

const logout =
  document.getElementById(
    "logout"
  );

const voiceBtn =
  document.getElementById(
    "voiceBtn"
  );

const videoBtn =
  document.getElementById(
    "videoBtn"
  );

const callModal =
  document.getElementById(
    "callModal"
  );

const videos =
  document.getElementById(
    "videos"
  );

const endCall =
  document.getElementById(
    "endCall"
  );

const mute =
  document.getElementById(
    "mute"
  );

const camera =
  document.getElementById(
    "camera"
  );


/* =================================
   CONNECT
================================= */

socket.on(
  "connect",
  () => {

    myId =
      socket.id;

    connection.textContent =
      "Connected";

    connection.style.color =
      "#10a58f";

  }
);


socket.on(
  "disconnect",
  () => {

    connection.textContent =
      "Disconnected";

    connection.style.color =
      "#e54848";

  }
);


/* =================================
   LOGIN
================================= */

joinBtn.onclick =
  register;

nameInput.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Enter"
    ) {

      register();

    }

  }
);


function register() {

  const name =
    nameInput.value.trim();

  if (!name) {

    alert(
      "Enter your name first."
    );

    return;

  }

  myName =
    name;

  localStorage.setItem(
    "ziqvonaName",
    myName
  );

  loginPage
    .classList
    .add("hidden");

  app
    .classList
    .remove("hidden");

  socket.emit(
    "register-user",
    {
      name: myName,
      avatar: "",
      status: "Online"
    }
  );

}


/* =================================
   ONLINE USERS
================================= */

socket.on(
  "online-users",
  (data) => {

    onlineUsers =
      data.users || [];

    renderPeople();

  }
);


socket.on(
  "user-online",
  (data) => {

    showNotice(
      `${data.user.name} is now online`
    );

  }
);


socket.on(
  "user-offline",
  (data) => {

    showNotice(
      `${data.name} went offline`
    );

  }
);


socket.on(
  "user-updated",
  () => {

    // Full list comes from
    // online-users.

  }
);


/* =================================
   PEOPLE LIST
================================= */

search.addEventListener(
  "input",
  renderPeople
);


function renderPeople() {

  peopleList.innerHTML =
    "";

  const query =
    search.value
      .trim()
      .toLowerCase();

  const filtered =
    onlineUsers.filter(
      (user) =>
        user.name
          .toLowerCase()
          .includes(query)
    );

  onlineCount.textContent =
    `${onlineUsers.length} online`;

  filtered.forEach(
    (user) => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "person";

      if (
        selectedUser &&
        selectedUser.id === user.id
      ) {

        row.classList.add(
          "active"
        );

      }

      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "avatar";

      avatar.textContent =
        user.name
          .charAt(0)
          .toUpperCase();

      const dot =
        document.createElement(
          "div"
        );

      dot.className =
        "online-dot";

      avatar.appendChild(
        dot
      );


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "person-info";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "person-name";

      name.textContent =
        user.id === myId
          ? `${user.name} (You)`
          : user.name;


      const status =
        document.createElement(
          "div"
        );

      status.className =
        "person-status";

      status.textContent =
        "Online";


      info.appendChild(
        name
      );

      info.appendChild(
        status
      );

      row.appendChild(
        avatar
      );

      row.appendChild(
        info
      );

      row.onclick =
        () => {

          if (
            user.id === myId
          ) {

            return;

          }

          openPrivateChat(
            user
          );

        };


      peopleList.appendChild(
        row
      );

    });

}


/* =================================
   GLOBAL CHAT
================================= */

function openGlobalChat() {

  selectedUser =
    null;

  globalChat =
    true;

  chatName.textContent =
    "ZIQVONA Global Chat";

  chatStatus.textContent =
    "Everyone";

  chatAvatar.textContent =
    "Z";

  clearMessages();

  renderPeople();

}


/* =================================
   PRIVATE CHAT
================================= */

function openPrivateChat(
  user
) {

  selectedUser =
    user;

  globalChat =
    false;

  chatName.textContent =
    user.name;

  chatStatus.textContent =
    "Online";

  chatAvatar.textContent =
    user.name
      .charAt(0)
      .toUpperCase();

  clearMessages();

  renderPeople();

  messageInput.focus();

}


/* =================================
   MESSAGES
================================= */

composer.addEventListener(
  "submit",
  (event) => {

    event.preventDefault();

    const text =
      messageInput.value.trim();

    if (!text) return;


    if (globalChat) {

      socket.emit(
        "global-message",
        {
          text
        }
      );

    } else {

      if (!selectedUser) {

        return;

      }

      socket.emit(
        "private-message",
        {
          targetId:
            selectedUser.id,

          text
        }
      );

    }

    messageInput.value =
      "";

  }
);


/* GLOBAL MESSAGE */

socket.on(
  "global-message",
  (message) => {

    if (!globalChat) return;

    addMessage(
      message
    );

  }
);


/* PRIVATE MESSAGE */

socket.on(
  "private-message",
  (message) => {

    if (
      selectedUser &&
      (
        message.senderId ===
        selectedUser.id

        ||

        message.senderId ===
        myId
      )
    ) {

      addMessage(
        message
      );

    }

  }
);


function addMessage(
  message
) {

  const empty =
    messages.querySelector(
      ".empty"
    );

  if (empty) {
    empty.remove();
  }


  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "message";

  if (
    message.senderId ===
    myId
  ) {

    wrapper.classList.add(
      "mine"
    );

  }


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  const sender =
    document.createElement(
      "div"
    );

  sender.className =
    "sender";

  sender.textContent =
    message.senderId ===
    myId
      ? "You"
      : message.senderName;


  const text =
    document.createElement(
      "div"
    );

  text.textContent =
    message.text;


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "time";

  time.textContent =
    new Date(
      message.time
    ).toLocaleTimeString(
      [],
      {
        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    );


  bubble.appendChild(
    sender
  );

  bubble.appendChild(
    text
  );

  bubble.appendChild(
    time
  );

  wrapper.appendChild(
    bubble
  );

  messages.appendChild(
    wrapper
  );

  messages.scrollTop =
    messages.scrollHeight;

}


function clearMessages() {

  messages.innerHTML = `
    <div class="empty">
      Start a conversation.
    </div>
  `;

}


/* =================================
   NOTICE
================================= */

function showNotice(
  text
) {

  console.log(
    "ZIQVONA:",
    text
  );

}


/* =================================
   EMOJI
================================= */

emoji.onclick =
  () => {

    messageInput.value +=
      " 😊";

    messageInput.focus();

  };


/* =================================
   WEBRTC
================================= */

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls:
        "stun:stun1.l.google.com:19302"
    }

  ]

};


async function getMedia(
  video
) {

  try {

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia(
          {
            audio: true,
            video
          }
        );

    showLocalVideo();

    return true;

  } catch (error) {

    console.error(
      error
    );

    alert(
      "Please allow microphone/camera access."
    );

    return false;

  }

}


function showLocalVideo() {

  let box =
    document.getElementById(
      "localVideo"
    );

  if (!box) {

    box =
      document.createElement(
        "div"
      );

    box.className =
      "video";

    box.id =
      "localVideo";

    videos.appendChild(
      box
    );

  }


  let video =
    box.querySelector(
      "video"
    );

  if (!video) {

    video =
      document.createElement(
        "video"
      );

    video.autoplay =
      true;

    video.muted =
      true;

    video.playsInline =
      true;

    box.appendChild(
      video
    );

  }

  video.srcObject =
    localStream;


  let label =
    box.querySelector(
      ".video-label"
    );

  if (!label) {

    label =
      document.createElement(
        "div"
      );

    label.className =
      "video-label";

    box.appendChild(
      label
    );

  }

  label.textContent =
    myName;

}


/* =================================
   PEER
================================= */

function createPeer(
  targetId
) {

  if (
    peers.has(targetId)
  ) {

    return peers.get(
      targetId
    );

  }


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        (track) => {

          pc.addTrack(
            track,
            localStream
          );

        }
      );

  }


  pc.onicecandidate =
    (event) => {

      if (
        event.candidate
      ) {

        socket.emit(
          "ice-candidate",
          {
            targetId,
            candidate:
              event.candidate
          }
        );

      }

    };


  pc.ontrack =
    (event) => {

      showRemoteVideo(
        targetId,
        event.streams[0]
      );

    };


  peers.set(
    targetId,
    pc
  );


  return pc;

}


/* =================================
   REMOTE VIDEO
================================= */

function showRemoteVideo(
  id,
  stream
) {

  let box =
    document.getElementById(
      "remote-" + id
    );

  if (!box) {

    box =
      document.createElement(
        "div"
      );

    box.className =
      "video";

    box.id =
      "remote-" + id;

    videos.appendChild(
      box
    );

  }


  let video =
    box.querySelector(
      "video"
    );

  if (!video) {

    video =
      document.createElement(
        "video"
      );

    video.autoplay =
      true;

    video.playsInline =
      true;

    box.appendChild(
      video
    );

  }

  video.srcObject =
    stream;


  let label =
    box.querySelector(
      ".video-label"
    );

  if (!label) {

    label =
      document.createElement(
        "div"
      );

    label.className =
      "video-label";

    box.appendChild(
      label
    );

  }


  const user =
    onlineUsers.find(
      (u) =>
        u.id === id
    );

  label.textContent =
    user
      ? user.name
      : "ZIQVONA User";

}


/* =================================
   CALL
================================= */

voiceBtn.onclick =
  () => {

    if (!selectedUser) {

      alert(
        "Select someone online first."
      );

      return;

    }

    startCall(
      selectedUser.id,
      false
    );

  };


videoBtn.onclick =
  () => {

    if (!selectedUser) {

      alert(
        "Select someone online first."
      );

      return;

    }

    startCall(
      selectedUser.id,
      true
    );

  };


async function startCall(
  targetId,
  video
) {

  const ok =
    await getMedia(
      video
    );

  if (!ok) return;

  callModal.classList.remove(
    "hidden"
  );


  const pc =
    createPeer(
      targetId
    );


  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );


  socket.emit(
    "call-user",
    {
      targetId,
      callType:
        video
          ? "video"
          : "voice",

      offer
    }
  );

}


/* =================================
   INCOMING
================================= */

socket.on(
  "incoming-call",
  async (data) => {

    const accept =
      confirm(
        `${data.fromName} is calling you. Accept?`
      );

    if (!accept) return;


    const video =
      data.callType ===
      "video";


    const ok =
      await getMedia(
        video
      );

    if (!ok) return;


    callModal.classList.remove(
      "hidden"
    );


    const pc =
      createPeer(
        data.from
      );


    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    socket.emit(
      "accept-call",
      {
        targetId:
          data.from,

        answer
      }
    );

  }
);


/* =================================
   ACCEPT
================================= */

socket.on(
  "call-accepted",
  async (data) => {

    const pc =
      peers.get(
        data.from
      );

    if (!pc) return;

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

  }
);


/* =================================
   ICE
================================= */

socket.on(
  "ice-candidate",
  async (data) => {

    const pc =
      peers.get(
        data.from
      );

    if (!pc) return;

    try {

      await pc.addIceCandidate(
        new RTCIceCandidate(
          data.candidate
        )
      );

    } catch (
      error
    ) {

      console.error(
        error
      );

    }

  }
);


/* =================================
   END CALL
================================= */

endCall.onclick =
  () => {

    peers.forEach(
      (pc) =>
        pc.close()
    );

    peers.clear();


    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          (track) =>
            track.stop()
        );

      localStream =
        null;

    }


    videos.innerHTML =
      "";

    callModal.classList.add(
      "hidden"
    );


    if (
      selectedUser
    ) {

      socket.emit(
        "end-call",
        {
          targetId:
            selectedUser.id
        }
      );

    }

  };


socket.on(
  "call-ended",
  () => {

    endCall.click();

  }
);


/* =================================
   MUTE
================================= */

mute.onclick =
  () => {

    if (!localStream)
      return;

    const tracks =
      localStream
        .getAudioTracks();

    tracks.forEach(
      (track) => {

        track.enabled =
          !track.enabled;

      }
    );

  };


/* =================================
   CAMERA
================================= */

camera.onclick =
  () => {

    if (!localStream)
      return;

    const tracks =
      localStream
        .getVideoTracks();

    tracks.forEach(
      (track) => {

        track.enabled =
          !track.enabled;

      }
    );

  };


/* =================================
   LOGOUT
================================= */

logout.onclick =
  () => {

    localStorage.removeItem(
      "ziqvonaName"
    );

    location.reload();

  };


/* =================================
   RESTORE NAME
================================= */

window.addEventListener(
  "load",
  () => {

    const saved =
      localStorage.getItem(
        "ziqvonaName"
      );

    if (saved) {

      nameInput.value =
        saved;

    }

  }
);

</script>
