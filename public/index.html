<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIQVONA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eefaf8;color:#123}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.hidden{display:none!important}
.app{max-width:1000px;margin:auto;min-height:100vh;background:white}
header{background:#13b8a6;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:800;letter-spacing:1px}
.badge{font-size:12px;background:rgba(255,255,255,.2);padding:6px 9px;border-radius:20px}
main{padding:22px}
.card{border:1px solid #d9efeb;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #0000000b}
input{width:100%;padding:14px;border:1px solid #c9e5e1;border-radius:12px;font-size:16px;margin:8px 0 12px}
.primary{background:#13b8a6;color:white}
.secondary{background:#e5f7f4;color:#087d72}
.danger{background:#ffe9e9;color:#b22}
.users{display:flex;flex-wrap:wrap;gap:10px}
.user{background:#f0faf8;padding:10px 13px;border-radius:20px}
.chat{height:55vh;overflow:auto;background:#f6fbfa;border-radius:15px;padding:15px}
.msg{max-width:75%;padding:10px 13px;margin:8px 0;border-radius:15px;background:white}
.msg.mine{margin-left:auto;background:#d8f7f2}
.time{font-size:10px;opacity:.55;margin-top:4px}
.row{display:flex;gap:8px;align-items:center}
.row input{margin:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.status{font-size:13px;color:#087d72;margin-top:8px}
small{opacity:.7}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">ZIQVONA</div>
  <div id="statusBadge" class="badge">Offline</div>
</header>

<main>
<section id="loginScreen" class="card">
  <h1>Byenveni sou ZIQVONA</h1>
  <p>Chat an tan reyèl, apèl vwa ak videyo.</p>
  <input id="username" maxlength="30" placeholder="Ekri non ou" autocomplete="off">
  <button id="loginBtn" class="primary">Konekte</button>
  <div id="loginStatus" class="status"></div>
</section>

<section id="homeScreen" class="hidden">
  <div class="card">
    <h2>👋 Bonjou, <span id="me"></span></h2>
    <p><small>Chwazi yon moun ki konekte pou kòmanse chat.</small></p>
    <div id="users" class="users"></div>
  </div>

  <div id="chatCard" class="card hidden">
    <h2>💬 Chat ak <span id="chatWith"></span></h2>
    <div id="chat" class="chat"></div>
    <div class="row" style="margin-top:10px">
      <input id="messageInput" placeholder="Ekri mesaj ou..." autocomplete="off">
      <button id="sendBtn" class="primary">Voye</button>
    </div>
    <div id="typing" class="status"></div>
    <div class="controls">
      <button id="voiceBtn" class="secondary">📞 Apèl vwa</button>
      <button id="videoBtn" class="secondary">📹 Videyo</button>
      <button id="endBtn" class="danger">✕ Fini apèl</button>
    </div>
  </div>
</section>
</main>
</div>

<script>
(function(){
  let ws = null;
  let me = "";
  let selectedUser = "";
  let localStream = null;
  let peer = null;
  let typingTimer = null;

  const $ = id => document.getElementById(id);

  function setStatus(text){
    $("statusBadge").textContent = text;
  }

  function show(id){
    $(id).classList.remove("hidden");
  }

  function hide(id){
    $(id).classList.add("hidden");
  }

  function escapeText(text){
    const div = document.createElement("div");
    div.textContent = String(text);
    return div.innerHTML;
  }

  function addMessage(m){
    const d = document.createElement("div");
    d.className = "msg" + (m.from === me ? " mine" : "");
    d.innerHTML = escapeText(m.text) +
      '<div class="time">' +
      new Date(m.time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) +
      "</div>";
    $("chat").appendChild(d);
    $("chat").scrollTop = $("chat").scrollHeight;
  }

  function renderUsers(list){
    const box = $("users");
    box.innerHTML = "";
    list.filter(u => u !== me).forEach(u => {
      const b = document.createElement("button");
      b.className = "user";
      b.textContent = "🟢 " + u;
      b.onclick = () => selectUser(u);
      box.appendChild(b);
    });
    if(!box.children.length){
      box.innerHTML = "<small>Pa gen lòt itilizatè konekte pou kounye a.</small>";
    }
  }

  function selectUser(u){
    selectedUser = u;
    $("chatWith").textContent = u;
    $("chat").innerHTML = "";
    $("typing").textContent = "";
    show("chatCard");
    $("messageInput").focus();
  }

  function connect(){
    me = $("username").value.trim();
    if(!me){
      $("loginStatus").textContent = "Tanpri mete yon non.";
      return;
    }

    $("loginStatus").textContent = "Koneksyon...";
    const protocol = location.protocol === "https:" ? "wss" : "ws";

    try{
      ws = new WebSocket(protocol + "://" + location.host);
    }catch(e){
      $("loginStatus").textContent = "Koneksyon an pa mache.";
      return;
    }

    ws.onopen = function(){
      ws.send(JSON.stringify({type:"login",username:me}));
    };

    ws.onmessage = function(event){
      let m;
      try{ m = JSON.parse(event.data); }catch(e){ return; }

      if(m.type === "login_ok"){
        hide("loginScreen");
        show("homeScreen");
        $("me").textContent = me;
        setStatus("Online");
        renderUsers(m.online || []);
      }

      if(m.type === "presence"){
        renderUsers(m.online || []);
      }

      if(m.type === "message"){
        if(m.from === selectedUser || m.to === selectedUser){
          addMessage(m);
        }
      }

      if(m.type === "typing"){
        if(m.from === selectedUser){
          $("typing").textContent = m.from + " ap ekri...";
          clearTimeout(typingTimer);
          typingTimer = setTimeout(() => $("typing").textContent = "", 1200);
        }
      }

      if(m.type === "error"){
        $("loginStatus").textContent = m.message || "Gen yon erè.";
      }

      if(m.type === "call-offer") handleOffer(m);
      if(m.type === "call-answer") handleAnswer(m);
      if(m.type === "ice") handleIce(m);
      if(m.type === "call-end") endCall(false);
    };

    ws.onclose = function(){
      setStatus("Offline");
    };

    ws.onerror = function(){
      $("loginStatus").textContent = "Pa kapab konekte ak sèvè a.";
    };
  }

  function sendMessage(){
    const text = $("messageInput").value.trim();
    if(!text || !selectedUser || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({
      type:"message",
      to:selectedUser,
      text:text
    }));
    $("messageInput").value = "";
  }

  function sendTyping(){
    if(!selectedUser || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({type:"typing",to:selectedUser}));
  }

  async function startCall(video){
    if(!selectedUser) return alert("Chwazi yon moun anvan.");
    try{
      localStream = await navigator.mediaDevices.getUserMedia({
        audio:true,
        video:video
      });
      peer = new RTCPeerConnection();
      localStream.getTracks().forEach(track => peer.addTrack(track, localStream));

      peer.onicecandidate = function(e){
        if(e.candidate){
          ws.send(JSON.stringify({type:"ice",to:selectedUser,candidate:e.candidate}));
        }
      };

      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);
      ws.send(JSON.stringify({
        type:"call-offer",
        to:selectedUser,
        offer:offer
      }));
      alert(video ? "Apèl videyo voye." : "Apèl vwa voye.");
    }catch(e){
      alert("Kamera/mikwo pa disponib. Sou telefòn, sèvi ak HTTPS.");
    }
  }

  async function handleOffer(m){
    if(!confirm(m.from + " ap rele ou. Aksepte?")) return;
    selectedUser = m.from;
    $("chatWith").textContent = selectedUser;
    show("chatCard");

    try{
      localStream = await navigator.mediaDevices.getUserMedia({
        audio:true,
        video:!!(m.offer && m.offer.sdp && m.offer.sdp.indexOf("m=video") >= 0)
      });
      peer = new RTCPeerConnection();
      localStream.getTracks().forEach(track => peer.addTrack(track, localStream));
      peer.onicecandidate = function(e){
        if(e.candidate){
          ws.send(JSON.stringify({type:"ice",to:m.from,candidate:e.candidate}));
        }
      };
      await peer.setRemoteDescription(m.offer);
      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);
      ws.send(JSON.stringify({type:"call-answer",to:m.from,answer:answer}));
    }catch(e){
      alert("Apèl la pa disponib sou aparèy sa a.");
    }
  }

  async function handleAnswer(m){
    if(peer) await peer.setRemoteDescription(m.answer);
  }

  async function handleIce(m){
    if(peer && m.candidate){
      try{ await peer.addIceCandidate(m.candidate); }catch(e){}
    }
  }

  function endCall(sendSignal){
    if(sendSignal && selectedUser && ws && ws.readyState === 1){
      ws.send(JSON.stringify({type:"call-end",to:selectedUser}));
    }
    if(localStream){
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
    if(peer){
      peer.close();
      peer = null;
    }
  }

  $("loginBtn").addEventListener("click", connect);
  $("username").addEventListener("keydown", e => {
    if(e.key === "Enter") connect();
  });
  $("sendBtn").addEventListener("click", sendMessage);
  $("messageInput").addEventListener("keydown", e => {
    if(e.key === "Enter") sendMessage();
  });
  $("messageInput").addEventListener("input", sendTyping);
  $("voiceBtn").addEventListener("click", () => startCall(false));
  $("videoBtn").addEventListener("click", () => startCall(true));
  $("endBtn").addEventListener("click", () => endCall(true));
})();
</script>
</body>
</html>
