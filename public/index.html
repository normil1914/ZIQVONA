<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#075e54"><title>ZIQVONA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#efeae2;color:#111}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}
.app{height:100vh;display:flex;overflow:hidden}.sidebar{width:360px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column}
.head{height:64px;background:#075e54;color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px}.logo{width:40px;height:40px;border-radius:50%;background:#10bfa3;display:grid;place-items:center;font-weight:900;font-size:20px}.brand{font-weight:800;font-size:20px;flex:1}
.icon{background:transparent;color:inherit;font-size:20px;padding:7px}.me{padding:10px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee}.avatar{width:48px;height:48px;border-radius:50%;background:#d9f3ee;color:#075e54;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.who{flex:1;min-width:0}.who b,.contact b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small,.contact small{color:#667781}
.searchbox{padding:8px 12px;background:#f0f2f5}.searchbox input{width:100%;border:0;border-radius:9px;padding:10px 13px;background:#fff;outline:none}
.contacts{overflow:auto;flex:1}.contact{height:72px;padding:10px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid #f0f0f0}.contact:hover,.contact.active{background:#f5f5f5}.preview{flex:1;min-width:0}.preview small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:11px;color:#8696a0}.online{width:9px;height:9px;border-radius:50%;background:#25d366}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#efeae2}.chathead{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 14px;gap:10px}.chathead .who{flex:1}.messages{flex:1;overflow:auto;padding:18px 7%;display:flex;flex-direction:column;gap:5px;background-image:linear-gradient(#efeae2,#efeae2)}.empty{margin:auto;text-align:center;color:#667781}.bubble{max-width:70%;padding:8px 10px 5px;border-radius:8px;background:#fff;align-self:flex-start;box-shadow:0 1px 1px #0001;white-space:pre-wrap;word-break:break-word}.bubble.mine{align-self:flex-end;background:#d9fdd3}.meta{text-align:right;color:#667781;font-size:10px;margin-top:3px}.composer{min-height:62px;background:#f0f2f5;display:flex;align-items:flex-end;gap:8px;padding:9px}.composer textarea{flex:1;border:0;border-radius:22px;padding:11px 15px;resize:none;outline:none;max-height:110px}.send{background:#075e54;color:#fff;width:44px;height:44px;border-radius:50%}.emojiPanel{position:absolute;bottom:65px;left:8px;width:270px;background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px;box-shadow:0 5px 25px #0002}.emojiPanel span{font-size:25px;padding:5px;display:inline-block}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50}.overlay.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(420px,92vw);padding:22px}.modal input,.modal textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin:6px 0 10px}.actions{display:flex;gap:8px;justify-content:flex-end}.primary{background:#075e54;color:#fff;padding:10px 15px;border-radius:9px}.secondary{background:#eee;padding:10px 15px;border-radius:9px}
.call{position:fixed;inset:0;background:#102a2b;color:#fff;z-index:100;display:none;flex-direction:column}.call.show{display:flex}.callarea{flex:1;position:relative;display:grid;place-items:center;padding:20px}.remote{width:min(900px,92vw);height:min(68vh,650px);background:#1d4546;border-radius:18px;display:grid;place-items:center;overflow:hidden}.remote video{width:100%;height:100%;object-fit:cover}.local{position:absolute;right:35px;bottom:35px;width:180px;height:130px;background:#000;border-radius:12px;overflow:hidden}.local video{width:100%;height:100%;object-fit:cover}.hang{background:#e53935;color:#fff;padding:14px 20px;border-radius:28px;margin:20px}
@media(max-width:650px){.sidebar{width:100px}.brand,.me .who,.searchbox{display:none}.me{justify-content:center}.contact{padding:10px;justify-content:center}.contact .preview{display:none}.chathead .back{display:block}.messages{padding:12px}.bubble{max-width:86%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="head"><div class="logo">Z</div><div class="brand">ZIQVONA</div><button class="icon" id="newBtn">＋</button><button class="icon" id="profileBtn">⋮</button></div>
 <div class="me" id="me"></div>
 <div class="searchbox"><input id="search" placeholder="Chèche kontak oswa non..."></div>
 <div class="contacts" id="contacts"></div>
</aside>
<main class="main">
 <div class="chathead"><button class="icon back" id="backBtn" style="display:none;color:#075e54">‹</button><div id="chatAvatar" class="avatar">Z</div><div class="who" id="chatWho"><b>ZIQVONA</b><small>Chwazi yon kontak</small></div><button class="icon" id="voice" style="color:#075e54;display:none">📞</button><button class="icon" id="video" style="color:#075e54;display:none">🎥</button></div>
 <div class="messages" id="messages"><div class="empty"><h2>💬</h2><p>Chwazi yon kontak pou kòmanse.</p></div></div>
 <div class="composer"><button class="icon" id="emojiBtn" style="color:#54656f">😊</button><textarea id="text" rows="1" disabled placeholder="Ekri yon mesaj"></textarea><button class="send" id="send" disabled>➤</button></div>
</main>
</div>
<div id="emojiPanel" class="emojiPanel" style="display:none"></div>
<div id="login" class="overlay"><div class="modal"><h2>Byenveni sou ZIQVONA</h2><p>Antre non ou pou kòmanse.</p><input id="loginName" maxlength="30" placeholder="Non ou"><input id="loginStatus" maxlength="120" placeholder="Status"><div class="actions"><button class="secondary" id="loginClose">Fèmen</button><button class="primary" id="loginGo">Konekte</button></div></div></div>
<div id="profileModal" class="overlay"><div class="modal"><h2>Profil mwen</h2><input id="pname" maxlength="50"><textarea id="pstatus" maxlength="120" placeholder="Status"></textarea><div class="actions"><button class="secondary" id="pclose">Fèmen</button><button class="primary" id="psave">Sove</button></div></div></div>
<div id="incoming" class="overlay"><div class="modal" style="text-align:center"><h2 id="incomingName">Apèl</h2><p id="incomingKind"></p><div class="actions" style="justify-content:center"><button class="secondary" id="reject">Refize</button><button class="primary" id="accept">Aksepte</button></div></div></div>
<div id="call" class="call"><div style="padding:18px;text-align:center"><b id="callTitle">Apèl ZIQVONA</b><div id="callState">Koneksyon...</div></div><div class="callarea"><div class="remote"><span id="remoteText">Ap tann lòt moun...</span><video id="remoteVideo" autoplay playsinline></video><div class="local"><video id="localVideo" autoplay muted playsinline></video></div></div></div><div style="text-align:center"><button class="hang" id="hang">⛔ Fini apèl</button></div></div>

<script>
"use strict";
const $=x=>document.getElementById(x);
const WS=(location.protocol==="https:"?"wss://":"ws://")+location.host;
let me=JSON.parse(localStorage.getItem("zq_me")||"null"), profiles={}, online=[], active=null, chats=JSON.parse(localStorage.getItem("zq_chats")||"{}"), ws=null, reconnect=null;
let pc=null,stream=null,callWith=null,callType=null,pending=null,ice=[];
const emojis=["😀","😂","😍","🥰","😎","👍","❤️","🔥","👏","🙏","😊","😭","🤣","🎉","💯","😢","😡","🤝","👋","✨"];

function save(){localStorage.setItem("zq_me",JSON.stringify(me));localStorage.setItem("zq_chats",JSON.stringify(chats))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function p(u){return profiles[u]||{username:u,displayName:u,status:"Disponib",avatar:""}}
function av(u){let x=p(u);return x.avatar?'<img src="'+esc(x.avatar)+'">':esc((x.displayName||u||"Z")[0])}
function send(o){if(ws?.readyState===1){ws.send(JSON.stringify(o));return true}return false}
function chat(u){return chats[u]||(chats[u]=[])}
function renderMe(){if(!me){$("me").innerHTML='<div class="avatar">Z</div><div class="who"><b>Pa konekte</b><small>Klike ⋮ pou konekte</small></div>';return}$("me").innerHTML='<div class="avatar">'+av(me.username)+'</div><div class="who"><b>'+esc(p(me.username).displayName)+'</b><small>'+esc(p(me.username).status||"Disponib")+'</small></div>'}
function renderContacts(){
 let q=$("search").value.trim().toLowerCase(),names=Object.keys(profiles).filter(u=>!me||u!==me.username);
 names=names.filter(u=>!q||u.toLowerCase().includes(q)||p(u).displayName.toLowerCase().includes(q));
 names.sort((a,b)=>(online.includes(b)?1:0)-(online.includes(a)?1:0));
 $("contacts").innerHTML=names.map(u=>'<div class="contact '+(active===u?"active":"")+'" data-u="'+esc(u)+'"><div class="avatar">'+av(u)+'</div><div class="preview"><b>'+esc(p(u).displayName)+'</b><small>@'+esc(u)+(online.includes(u)?" · 🟢 online":" · offline")+'</small></div>'+(online.includes(u)?'<span class="online"></span>':'')+'</div>').join("")||'<div style="padding:25px;text-align:center;color:#667781">Pa gen kontak pou kounye a.</div>';
 document.querySelectorAll(".contact").forEach(x=>x.onclick=()=>openChat(x.dataset.u))
}
function renderMessages(){
 if(!active){$("messages").innerHTML='<div class="empty"><h2>💬</h2><p>Chwazi yon kontak pou kòmanse.</p></div>';return}
 let a=chat(active);$("messages").innerHTML=a.length?a.map(m=>'<div class="bubble '+(m.from===me.username?"mine":"")+'">'+esc(m.text||"")+'<div class="meta">'+new Date(m.time).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+(m.read?" ✓✓":m.delivered?" ✓":"")+'</div></div>').join(""):'<div class="empty"><p>Pa gen mesaj. Di bonjou 👋</p></div>';
 $("messages").scrollTop=$("messages").scrollHeight
}
function openChat(u){if(!me){$("login").classList.add("show");return}active=u;$("chatAvatar").innerHTML=av(u);$("chatWho").innerHTML='<b>'+esc(p(u).displayName)+'</b><small>@'+esc(u)+' · '+(online.includes(u)?"online":"offline")+'</small>';$("text").disabled=false;$("send").disabled=false;$("voice").style.display="block";$("video").style.display="block";renderContacts();renderMessages();send({type:"history",with:u})}
function add(m){let u=m.from===me.username?m.to:m.from,a=chat(u);if(!a.some(x=>x.id===m.id))a.push(m);if(a.length>500)a.splice(0,a.length-500);save();if(active===u)renderMessages()}
function connect(){if(!me)return;try{ws=new WebSocket(WS)}catch{return}ws.onopen=()=>send({type:"login",username:me.username});ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
 if(m.type==="login_ok"){profiles=m.profiles||{};online=m.online||[];renderMe();renderContacts();return}
 if(m.type==="presence"){profiles=m.profiles||profiles;online=m.online||[];renderMe();renderContacts();if(active){let u=active;$("chatWho").innerHTML='<b>'+esc(p(u).displayName)+'</b><small>@'+esc(u)+' · '+(online.includes(u)?"online":"offline")+'</small>'}return}
 if(m.type==="profiles"){profiles={...profiles,...m.profiles};renderMe();renderContacts();return}
 if(m.type==="search_results"){m.results.forEach(x=>profiles[x.username]=x);renderContacts();return}
 if(m.type==="profile"){profiles[m.profile.username]=m.profile;save();renderMe();renderContacts();return}
 if(m.type==="message"){add(m);if(m.from!==me.username)send({type:"message_delivered",to:m.from,messageId:m.id});return}
 if(m.type==="history"){let a=chat(m.with);(m.messages||[]).forEach(x=>{if(!a.some(y=>y.id===x.id))a.push(x)});save();if(active===m.with)renderMessages();return}
 if(m.type==="message_delivered"){Object.values(chats).forEach(a=>a.forEach(x=>{if(x.id===m.messageId)x.delivered=true}));save();renderMessages();return}
 if(m.type==="message_read"){Object.values(chats).forEach(a=>a.forEach(x=>{if(x.id===m.messageId)x.read=true}));save();renderMessages();return}
 if(m.type==="error"){alert(m.message);return}
 if(["call-offer","call-answer","ice","call-end"].includes(m.type))signal(m)
};ws.onclose=()=>{clearTimeout(reconnect);reconnect=setTimeout(connect,2000)}}
function doLogin(){let n=$("loginName").value.trim();if(n.length<2){alert("Mete yon non.");return}me={username:n,displayName:n,status:$("loginStatus").value.trim()||"Disponib",avatar:me?.avatar||""};save();$("login").classList.remove("show");connect()}
function sendMsg(){let t=$("text").value.trim();if(!active||!t)return;if(send({type:"message",to:active,text:t}))$("text").value=""}
function profileOpen(){if(!me){$("login").classList.add("show");return}let x=p(me.username);$("pname").value=x.displayName;$("pstatus").value=x.status;$("profileModal").classList.add("show")}
function saveProfile(){let n=$("pname").value.trim()||me.username,s=$("pstatus").value.trim()||"Disponib";me.displayName=n;me.status=s;save();send({type:"profile_update",displayName:n,status:s});$("profileModal").classList.remove("show")}
async function makeCall(type){if(!active||!online.includes(active)){alert("Moun nan pa online.");return}callWith=active;callType=type;$("call").classList.add("show");$("callTitle").textContent=(type==="video"?"🎥":"📞")+" "+p(active).displayName;try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:type==="video"});$("localVideo").srcObject=stream;peer();let offer=await pc.createOffer();await pc.setLocalDescription(offer);send({type:"call-offer",to:callWith,callType:type,offer:pc.localDescription})}catch(e){alert("Kamera/mikwo pa disponib: "+e.message);end(false)}}
function peer(){pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:"stun:stun.cloudflare.com:3478"}]});stream?.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{$("remoteVideo").srcObject=e.streams[0];$("remoteText").style.display="none"};pc.onicecandidate=e=>{if(e.candidate&&callWith)send({type:"ice",to:callWith,candidate:e.candidate})};pc.onconnectionstatechange=()=>{$("callState").textContent="Koneksyon: "+pc.connectionState}}
async function signal(m){if(m.type==="call-end"){end(false);return}if(m.type==="call-offer"){pending=m;callWith=m.from;callType=m.callType||"voice";$("incomingName").textContent="📲 "+p(m.from).displayName;$("incomingKind").textContent=callType==="video"?"Apèl videyo ap vini":"Apèl vwa ap vini";$("incoming").classList.add("show");return}if(m.type==="call-answer"&&pc){await pc.setRemoteDescription(m.answer);for(let c of ice)try{await pc.addIceCandidate(c)}catch{}ice=[];return}if(m.type==="ice"&&m.candidate){if(pc?.remoteDescription)try{await pc.addIceCandidate(m.candidate)}catch{}else ice.push(m.candidate)}}
async function accept(){ $("incoming").classList.remove("show");$("call").classList.add("show");$("callTitle").textContent=(callType==="video"?"🎥":"📞")+" "+p(callWith).displayName;try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:callType==="video"});$("localVideo").srcObject=stream;peer();await pc.setRemoteDescription(pending.offer);for(let c of ice)try{await pc.addIceCandidate(c)}catch{}ice=[];let a=await pc.createAnswer();await pc.setLocalDescription(a);send({type:"call-answer",to:callWith,answer:pc.localDescription})}catch(e){alert(e.message);end(true)}}
function reject(){if(callWith)send({type:"call-end",to:callWith});pending=null;callWith=null;$("incoming").classList.remove("show")}
function end(notify=true){if(notify&&callWith)send({type:"call-end",to:callWith});try{pc?.close()}catch{}pc=null;stream?.getTracks().forEach(t=>t.stop());stream=null;$("localVideo").srcObject=null;$("remoteVideo").srcObject=null;$("call").classList.remove("show");pending=null;ice=[];callWith=null;callType=null}
$("profileBtn").onclick=profileOpen;$("newBtn").onclick=()=>{$("search").focus()};$("loginGo").onclick=doLogin;$("loginClose").onclick=()=>$("login").classList.remove("show");$("pclose").onclick=()=>$("profileModal").classList.remove("show");$("psave").onclick=saveProfile;$("send").onclick=sendMsg;$("text").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg()}else if(active&&e.key.length===1)send({type:"typing",to:active})});$("search").oninput=()=>{let q=$("search").value;send({type:"search_users",query:q});renderContacts()};$("voice").onclick=()=>makeCall("voice");$("video").onclick=()=>makeCall("video");$("hang").onclick=()=>end(true);$("accept").onclick=accept;$("reject").onclick=reject;$("emojiBtn").onclick=()=>{$("emojiPanel").style.display=$("emojiPanel").style.display==="none"?"block":"none"};$("emojiPanel").innerHTML=emojis.map(x=>"<span>"+x+"</span>").join("");$("emojiPanel").querySelectorAll("span").forEach(x=>x.onclick=()=>{$("text").value+=x.textContent;$("text").focus()});
renderMe();renderContacts();renderMessages();if(me)connect();else $("login").classList.add("show");
})();
</script>
</body></html>
