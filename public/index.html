<!doctype html>
<html lang="ht">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#10bfa3"
>

<title>ZIQVONA — Kontak</title>

<script src="/socket.io/socket.io.js"></script>

<style>

:root{
  --turquoise:#10bfa3;
  --turquoise-dark:#078f7c;
  --text:#12302d;
  --muted:#728582;
  --line:#d8eee9;
  --white:#ffffff;
  --background:#eaf9f6;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  color:var(--text);
}

body{
  overflow:hidden;
  background:
    radial-gradient(
      circle at center,
      #ffffff 0%,
      #eaf9f6 55%,
      #dff6f1 100%
    );
}

/*
  ZIQVONA BACKGROUND LOGO
*/

body::before{
  content:"ZIQVONA";

  position:fixed;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:
    clamp(
      80px,
      17vw,
      240px
    );

  font-weight:900;

  letter-spacing:10px;

  color:
    rgba(
      16,
      191,
      163,
      .075
    );

  pointer-events:none;

  z-index:0;
}

/*
  MAIN APP
*/

.app{
  position:relative;

  z-index:1;

  width:100%;

  height:100vh;

  display:grid;

  grid-template-columns:
    370px
    1fr;
}

/*
  LEFT CONTACT PANEL
*/

.left{
  height:100%;

  background:
    rgba(
      255,
      255,
      255,
      .97
    );

  border-right:
    1px solid
    var(--line);

  display:flex;

  flex-direction:column;
}

/*
  HEADER
*/

.header{
  height:76px;

  padding:
    14px 18px;

  display:flex;

  align-items:center;

  gap:12px;

  border-bottom:
    1px solid
    var(--line);
}

.logo{
  width:50px;

  height:50px;

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      #10bfa3,
      #057e70
    );

  color:white;

  display:grid;

  place-items:center;

  font-weight:1000;

  font-size:27px;

  box-shadow:
    0 8px 22px
    rgba(
      16,
      191,
      163,
      .20
    );
}

.logoText b{
  display:block;

  font-size:21px;

  letter-spacing:.5px;
}

.logoText span{
  color:var(--muted);

  font-size:12px;
}

/*
  MY PROFILE
*/

.profile{
  margin:14px;

  padding:12px;

  border:
    1px solid
    var(--line);

  border-radius:17px;

  background:#f8fffd;

  display:flex;

  gap:11px;

  align-items:center;
}

.avatar{
  width:46px;

  height:46px;

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #10bfa3,
      #078f7c
    );

  color:white;

  display:grid;

  place-items:center;

  font-weight:900;

  overflow:hidden;

  flex:none;
}

.avatar img{
  width:100%;

  height:100%;

  object-fit:cover;
}

.ptext{
  min-width:0;

  flex:1;
}

.ptext b{
  display:block;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.ptext span{
  color:var(--muted);

  font-size:12px;
}

.icon{
  border:0;

  background:#e8f8f4;

  color:var(--turquoise-dark);

  width:40px;

  height:40px;

  border-radius:12px;

  font-size:18px;

  cursor:pointer;
}

.icon:hover{
  background:#d9f5ef;
}

/*
  SEARCH
*/

.search{
  padding:
    0 14px 10px;
}

.search input{
  width:100%;

  border:
    1px solid
    var(--line);

  border-radius:13px;

  padding:13px;

  outline:0;

  font-size:14px;

  background:white;
}

.search input:focus{
  border-color:
    var(--turquoise);
}

/*
  CONTACT TITLE
*/

.label{
  padding:
    7px 18px;

  color:var(--muted);

  font-size:11px;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.8px;
}

/*
  CONTACT LIST
*/

.contacts{
  overflow:auto;

  padding:
    0 9px 18px;
}

.contact{
  display:flex;

  align-items:center;

  gap:11px;

  padding:12px;

  border-radius:14px;

  cursor:pointer;

  transition:.15s;
}

.contact:hover{
  background:#eefbf8;
}

.contact.active{
  background:#e3f8f3;
}

.ci{
  flex:1;

  min-width:0;
}

.ci b{
  display:block;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.ci span{
  font-size:12px;

  color:var(--muted);
}

.online{
  width:9px;

  height:9px;

  border-radius:50%;

  background:#19c978;

  flex:none;
}

.emptyContacts{
  padding:20px;

  color:var(--muted);

  font-size:13px;

  text-align:center;
}

/*
  RIGHT SIDE
*/

.right{
  height:100%;

  display:flex;

  flex-direction:column;

  min-width:0;
}

/*
  CHAT HEADER
*/

.top{
  height:76px;

  background:
    rgba(
      255,
      255,
      255,
      .94
    );

  border-bottom:
    1px solid
    var(--line);

  display:flex;

  align-items:center;

  padding:
    0 20px;

  gap:12px;
}

.topAvatar{
  width:44px;

  height:44px;

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #10bfa3,
      #078f7c
    );

  color:white;

  display:grid;

  place-items:center;

  font-weight:900;

  overflow:hidden;
}

.topAvatar img{
  width:100%;

  height:100%;

  object-fit:cover;
}

.tt{
  flex:1;

  min-width:0;
}

.tt b{
  display:block;

  font-size:18px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.tt span{
  font-size:12px;

  color:var(--muted);
}

.global{
  border:0;

  background:
    var(--turquoise);

  color:white;

  padding:
    11px 15px;

  border-radius:12px;

  font-weight:800;

  cursor:pointer;
}

.global:hover{
  background:
    var(--turquoise-dark);
}

/*
  MESSAGES
*/

.messages{
  flex:1;

  overflow:auto;

  padding:24px;

  display:flex;

  flex-direction:column;

  gap:9px;
}

.welcome{
  margin:auto;

  text-align:center;

  color:var(--muted);

  max-width:450px;
}

.welcomeMark{
  width:90px;

  height:90px;

  border-radius:28px;

  margin:
    auto auto 14px;

  display:grid;

  place-items:center;

  background:
    linear-gradient(
      145deg,
      #10bfa3,
      #057e70
    );

  color:white;

  font-size:48px;

  font-weight:1000;

  box-shadow:
    0 15px 35px
    rgba(
      16,
      191,
      163,
      .20
    );
}

.welcome h2{
  color:var(--text);

  margin:
    8px 0;
}

.welcome p{
  line-height:1.6;
}

/*
  MESSAGE
*/

.msg{
  max-width:
    min(
      680px,
      80%
    );

  background:white;

  border:
    1px solid
    var(--line);

  padding:
    10px 13px;

  border-radius:17px;

  box-shadow:
    0 3px 12px
    rgba(
      0,
      0,
      0,
      .03
    );
}

.msg.mine{
  align-self:flex-end;

  background:#d9f8f1;
}

.msg b{
  font-size:12px;

  color:
    var(--turquoise-dark);
}

.msg p{
  margin:5px 0;

  white-space:pre-wrap;

  word-break:break-word;
}

.msg time{
  font-size:10px;

  color:#899b98;
}

/*
  TYPING
*/

.typing{
  height:22px;

  padding:
    0 22px;

  color:var(--muted);

  font-size:12px;
}

/*
  COMPOSER
*/

.composer{
  display:flex;

  gap:8px;

  padding:
    12px 16px;

  background:white;

  border-top:
    1px solid
    var(--line);
}

.composer input{
  flex:1;

  border:
    1px solid
    var(--line);

  border-radius:14px;

  padding:13px;

  outline:0;

  font-size:15px;
}

.composer input:focus{
  border-color:
    var(--turquoise);
}

.send{
  border:0;

  background:
    var(--turquoise);

  color:white;

  padding:
    0 18px;

  border-radius:13px;

  font-weight:800;

  cursor:pointer;
}

.send:hover{
  background:
    var(--turquoise-dark);
}

/*
  PROFILE MODAL
*/

.overlay{
  position:fixed;

  inset:0;

  background:
    rgba(
      6,
      58,
      51,
      .67
    );

  display:none;

  align-items:center;

  justify-content:center;

  z-index:5;
}

.modal{
  background:white;

  width:
    min(
      430px,
      92vw
    );

  padding:23px;

  border-radius:22px;

  box-shadow:
    0 20px 70px
    rgba(
      0,
      0,
      0,
      .25
    );
}

.modal h2{
  margin:
    0 0 6px;
}

.modal p{
  color:var(--muted);

  font-size:13px;
}

.modal input{
  width:100%;

  padding:13px;

  border:
    1px solid
    var(--line);

  border-radius:12px;

  margin:6px 0;

  outline:0;
}

.actions{
  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:9px;
}

.actions button{
  border:0;

  padding:
    11px 15px;

  border-radius:11px;

  cursor:pointer;

  font-weight:800;
}

.save{
  background:
    var(--turquoise);

  color:white;
}

/*
  MOBILE
*/

@media(max-width:760px){

  .app{
    grid-template-columns:1fr;
  }

  .left{
    display:none;
  }

  .messages{
    padding:14px;
  }

  .top{
    height:65px;
  }

  .msg{
    max-width:91%;
  }

}

</style>
</head>

<body>

<div class="app">

<!-- CONTACTS -->

<aside class="left">

  <div class="header">

    <div class="logo">
      Z
    </div>

    <div class="logoText">

      <b>ZIQVONA</b>

      <span>
        Kontak yo
      </span>

    </div>

  </div>


  <!-- MY PROFILE -->

  <div class="profile">

    <div
      class="avatar"
      id="myAvatar"
    >
      Z
    </div>

    <div class="ptext">

      <b id="myName">
        ZIQVONA User
      </b>

      <span id="myStatus">
        Online
      </span>

    </div>

    <button
      class="icon"
      id="edit"
      title="Modifye profil"
    >
      ✎
    </button>

  </div>


  <!-- SEARCH -->

  <div class="search">

    <input
      id="search"
      placeholder="Chèche kontak..."
      autocomplete="off"
    >

  </div>


  <div class="label">
    Kontak yo
  </div>


  <div
    class="contacts"
    id="contacts"
  ></div>

</aside>


<!-- CHAT -->

<main class="right">

  <div class="top">

    <div
      class="topAvatar"
      id="topAvatar"
    >
      Z
    </div>

    <div class="tt">

      <b id="title">
        Kontak ZIQVONA
      </b>

      <span id="sub">
        Moun online yo ap parèt isit la
      </span>

    </div>

    <button
      class="global"
      id="global"
    >
      🌎 Global
    </button>

  </div>


  <div
    class="messages"
    id="messages"
  >

    <div class="welcome">

      <div class="welcomeMark">
        Z
      </div>

      <h2>
        Byenveni sou ZIQVONA
      </h2>

      <p>
        Kontak yo chaje dirèkteman
        lè ou antre.
        Chwazi yon kontak pou kòmanse
        yon chat prive.
      </p>

    </div>

  </div>


  <div
    class="typing"
    id="typing"
  ></div>


  <form
    class="composer"
    id="form"
  >

    <button
      type="button"
      class="icon"
      id="emoji"
    >
      😊
    </button>

    <input
      id="input"
      placeholder="Ekri yon mesaj..."
      autocomplete="off"
    >

    <button
      class="send"
      type="submit"
    >
      Voye
    </button>

  </form>

</main>

</div>


<!-- PROFILE WINDOW -->

<div
  class="overlay"
  id="overlay"
>

  <div class="modal">

    <h2>
      Profil mwen
    </h2>

    <p>
      Chanje non ak status ou.
    </p>

    <input
      id="nameInput"
      maxlength="40"
      placeholder="Non ou"
    >

    <input
      id="statusInput"
      maxlength="100"
      placeholder="Status ou"
    >

    <div class="actions">

      <button
        id="close"
        type="button"
      >
        Fèmen
      </button>

      <button
        class="save"
        id="save"
        type="button"
      >
        Sove
      </button>

    </div>

  </div>

</div>


<script>

const socket =
  io();


/*
  USER DATA
*/

let me =
  JSON.parse(
    localStorage.getItem(
      "ziqvona_me"
    ) || "null"
  ) || {

    name:
      "ZIQVONA User",

    status:
      "Online",

    avatar:
      ""

  };


let contacts = [];

let selected =
  null;

let globalMode =
  false;

let globalMessages =
  [];

let privateMessages =
  {};

let typingTimer;


/*
  SHORT SELECTOR
*/

const $ =
  id =>
    document.getElementById(id);


/*
  SECURITY
*/

function escapeHtml(
  value
){

  return String(
    value
  ).replace(
    /[&<>"']/g,
    character => {

      const map = {

        "&":
          "&amp;",

        "<":
          "&lt;",

        ">":
          "&gt;",

        '"':
          "&quot;",

        "'":
          "&#039;"

      };

      return map[
        character
      ];

    }
  );

}


/*
  INITIAL
*/

function initial(
  name
){

  return (
    name ||
    "Z"
  )
    .trim()
    .slice(
      0,
      1
    )
    .toUpperCase();

}


/*
  AVATAR
*/

function avatar(
  user
){

  if(
    user &&
    user.avatar
  ){

    return `
      <img
        src="${escapeHtml(
          user.avatar
        )}"
        alt=""
      >
    `;

  }

  return initial(
    user?.name
  );

}


/*
  CONNECT USER
*/

socket.emit(
  "register",
  me
);


/*
  SERVER RETURNS ME
*/

socket.on(
  "me",
  user => {

    me =
      user;

    localStorage.setItem(
      "ziqvona_me",
      JSON.stringify(
        me
      )
    );

    updateMe();

  }
);


/*
  CONTACT LIST
*/

socket.on(
  "contacts",
  list => {

    contacts =
      list;

    renderContacts();

    if(
      selected
    ){

      const updated =
        contacts.find(
          user =>
            user.id ===
            selected.id
        );

      if(
        updated
      ){

        selected =
          updated;

      }

      updateTop();

    }

  }
);


/*
  GLOBAL MESSAGE
*/

socket.on(
  "global-message",
  message => {

    globalMessages.push(
      message
    );

    if(
      globalMode
    ){

      renderMessages();

    }

  }
);


/*
  PRIVATE MESSAGE
*/

socket.on(
  "private-message",
  message => {

    const key =
      [
        message.senderId,
        message.targetId
      ]
        .sort()
        .join(":");

    if(
      !privateMessages[key]
    ){

      privateMessages[key] =
        [];

    }

    privateMessages[key].push(
      message
    );

    if(
      selected &&
      !globalMode &&
      [
        message.senderId,
        message.targetId
      ].includes(
        selected.id
      )
    ){

      renderMessages();

    }

  }
);


/*
  TYPING
*/

socket.on(
  "typing",
  data => {

    if(
      selected &&
      !globalMode &&
      data.from ===
        selected.id
    ){

      $("typing").textContent =
        data.name +
        " ap ekri...";

    }

  }
);


/*
  STOP TYPING
*/

socket.on(
  "stop-typing",
  data => {

    if(
      selected?.id ===
      data.from
    ){

      $("typing").textContent =
        "";

    }

  }
);


/*
  UPDATE MY PROFILE
*/

function updateMe(){

  $("myName")
    .textContent =
    me.name;

  $("myStatus")
    .textContent =
    me.status ||
    "Online";

  $("myAvatar")
    .innerHTML =
    avatar(
      me
    );

}


/*
  CONTACTS
*/

function renderContacts(){

  const query =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const list =
    contacts.filter(
      user =>

        user.id !==
        me.id &&

        (
          !query ||

          user.name
            .toLowerCase()
            .includes(
              query
            )
        )
    );


  if(
    list.length === 0
  ){

    $("contacts")
      .innerHTML = `
        <div
          class="emptyContacts"
        >
          Pa gen lòt moun
          online pou kounye a.
        </div>
      `;

    return;

  }


  $("contacts")
    .innerHTML =

    list.map(
      user => `

        <div
          class="contact ${
            selected?.id === user.id &&
            !globalMode
              ? "active"
              : ""
          }"
          data-id="${user.id}"
        >

          <div class="avatar">
            ${avatar(user)}
          </div>

          <div class="ci">

            <b>
              ${escapeHtml(
                user.name
              )}
            </b>

            <span>
              ${escapeHtml(
                user.status ||
                "Online"
              )}
            </span>

          </div>

          <i
            class="online"
          ></i>

        </div>

      `
    ).join("");


  document
    .querySelectorAll(
      ".contact"
    )
    .forEach(
      element => {

        element.onclick =
          () => {

            const user =
              contacts.find(
                contact =>
                  contact.id ===
                  element.dataset.id
              );

            if(
              !user
            ){

              return;

            }

            selected =
              user;

            globalMode =
              false;

            $("typing")
              .textContent =
              "";

            updateTop();

            renderContacts();

            renderMessages();

          };

      }
    );

}


/*
  TOP BAR
*/

function updateTop(){

  if(
    globalMode
  ){

    $("title")
      .textContent =
      "Global Chat";

    $("sub")
      .textContent =
      "Tout moun ki konekte sou ZIQVONA";

    $("topAvatar")
      .innerHTML =
      "🌎";

    return;

  }


  $("title")
    .textContent =
    selected?.name ||
    "Kontak ZIQVONA";


  $("sub")
    .textContent =
    selected?.status ||
    "Moun online yo ap parèt isit la";


  $("topAvatar")
    .innerHTML =
    avatar(
      selected
    );

}


/*
  MESSAGE RENDER
*/

function renderMessages(){

  let list =
    [];


  if(
    globalMode
  ){

    list =
      globalMessages;

  }

  else if(
    selected
  ){

    const key =
      [
        selected.id,
        me.id
      ]
        .sort()
        .join(":");


    list =
      privateMessages[key] ||
      [];

  }


  if(
    list.length === 0
  ){

    $("messages")
      .innerHTML = `

        <div class="welcome">

          <div class="welcomeMark">

            ${
              globalMode
                ? "🌎"
                : initial(
                    selected?.name
                  )
            }

          </div>

          <h2>

            ${
              globalMode
                ? "Global Chat"
                : escapeHtml(
                    selected?.name ||
                    "Kontak ZIQVONA"
                  )
            }

          </h2>

          <p>

            ${
              globalMode
                ? "Voye yon mesaj pou tout moun online."
                : "Voye premye mesaj la pou kòmanse chat prive."
            }

          </p>

        </div>

      `;

    return;

  }


  $("messages")
    .innerHTML =

    list.map(
      message => `

        <div
          class="msg ${
            message.senderId ===
            me.id
              ? "mine"
              : ""
          }"
        >

          <b>

            ${
              escapeHtml(
                message.senderId ===
                me.id
                  ? "Ou"
                  : message.senderName
              )
            }

          </b>

          <p>

            ${escapeHtml(
              message.text
            )}

          </p>

          <time>

            ${
              new Date(
                message.time
              ).toLocaleTimeString(
                [],
                {
                  hour:"2-digit",
                  minute:"2-digit"
                }
              )
            }

          </time>

        </div>

      `
    ).join("");


  $("messages")
    .scrollTop =
    $("messages")
      .scrollHeight;

}


/*
  SEND MESSAGE
*/

$("form")
  .onsubmit =
  event => {

    event.preventDefault();


    const text =
      $("input")
        .value
        .trim();


    if(
      !text
    ){

      return;

    }


    if(
      globalMode
    ){

      socket.emit(
        "global-message",
        {
          text
        }
      );

    }

    else if(
      selected
    ){

      socket.emit(
        "private-message",
        {
          targetId:
            selected.id,

          text
        }
      );

    }


    $("input")
      .value =
      "";

    $("typing")
      .textContent =
      "";

  };


/*
  TYPING
*/

$("input")
  .oninput =
  () => {

    if(
      !selected ||
      globalMode
    ){

      return;

    }


    socket.emit(
      "typing",
      {
        targetId:
          selected.id
      }
    );


    clearTimeout(
      typingTimer
    );


    typingTimer =
      setTimeout(
        () => {

          socket.emit(
            "stop-typing",
            {
              targetId:
                selected.id
            }
          );

        },
        700
      );

  };


/*
  GLOBAL CHAT
*/

$("global")
  .onclick =
  () => {

    selected =
      null;

    globalMode =
      true;

    $("typing")
      .textContent =
      "";

    updateTop();

    renderContacts();

    renderMessages();

  };


/*
  SEARCH
*/

$("search")
  .oninput =
  renderContacts;


/*
  EMOJI
*/

$("emoji")
  .onclick =
  () => {

    $("input")
      .value +=
      " 😊";

    $("input")
      .focus();

  };


/*
  PROFILE WINDOW
*/

$("edit")
  .onclick =
  () => {

    $("nameInput")
      .value =
      me.name || "";

    $("statusInput")
      .value =
      me.status ||
      "Online";

    $("overlay")
      .style.display =
      "flex";

  };


$("close")
  .onclick =
  () => {

    $("overlay")
      .style.display =
      "none";

  };


/*
  SAVE PROFILE
*/

$("save")
  .onclick =
  () => {

    me.name =
      $("nameInput")
        .value
        .trim() ||
      "ZIQVONA User";


    me.status =
      $("statusInput")
        .value
        .trim() ||
      "Online";


    localStorage.setItem(
      "ziqvona_me",
      JSON.stringify(
        me
      )
    );


    socket.emit(
      "update-profile",
      me
    );


    $("overlay")
      .style.display =
      "none";

  };


/*
  START UI
*/

updateMe();

updateTop();

</script>

</body>
</html>
