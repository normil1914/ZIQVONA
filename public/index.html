<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<meta name="theme-color" content="#10bfa3">

<title>ZIQVONA — Room</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --turq:#10bfa3;
  --turq-dark:#079b86;
  --turq-light:#dffaf5;
  --bg:#eef5f4;
  --white:#ffffff;
  --text:#17211f;
  --muted:#70807d;
  --border:#e1e9e7;
  --danger:#e74c3c;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* ==============================
   LOGIN
============================== */

#loginScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  background:
    radial-gradient(circle at top left,#31d9bd,transparent 35%),
    linear-gradient(135deg,#071e1a,#0d5d50);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.97);
  border-radius:28px;
  padding:35px 28px;
  box-shadow:0 25px 80px rgba(0,0,0,.25);
  text-align:center;
}

.logo{
  width:92px;
  height:92px;
  margin:0 auto 18px;
  border-radius:26px;
  background:var(--turq);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:34px;
  font-weight:900;
  box-shadow:0 12px 30px rgba(16,191,163,.35);
}

.loginBox h1{
  font-size:32px;
  margin-bottom:8px;
  letter-spacing:2px;
}

.loginBox p{
  color:var(--muted);
  margin-bottom:25px;
}

.input{
  width:100%;
  height:52px;
  border:1px solid var(--border);
  border-radius:15px;
  padding:0 16px;
  outline:none;
  font-size:16px;
  background:#f8fbfa;
}

.input:focus{
  border-color:var(--turq);
  box-shadow:0 0 0 3px rgba(16,191,163,.12);
}

.btn{
  border:0;
  border-radius:14px;
  min-height:48px;
  padding:0 20px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--turq);
  color:white;
  width:100%;
  margin-top:15px;
}

.btn-primary:hover{
  background:var(--turq-dark);
}

.error{
  color:var(--danger);
  font-size:14px;
  margin-top:12px;
  min-height:18px;
}

/* ==============================
   APP
============================== */

#app{
  display:none;
  height:100vh;
  width:100%;
}

.room{
  display:grid;
  grid-template-columns:360px 1fr;
  height:100%;
  background:white;
}

/* ==============================
   SIDEBAR
============================== */

.sidebar{
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  background:#fff;
  min-width:0;
}

.sideTop{
  padding:20px;
  border-bottom:1px solid var(--border);
}

.brandRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brandLogo{
  width:45px;
  height:45px;
  border-radius:13px;
  background:var(--turq);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:900;
  font-size:17px;
}

.brandName{
  font-size:21px;
  font-weight:900;
  letter-spacing:1px;
}

.profileMini{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:var(--turq-light);
  color:var(--turq-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.search{
  position:relative;
}

.search input{
  width:100%;
  height:44px;
  border:0;
  background:#f2f7f6;
  border-radius:13px;
  padding:0 15px 0 42px;
  outline:none;
  font-size:14px;
}

.search span{
  position:absolute;
  left:15px;
  top:13px;
  color:#7d8d8a;
}

.tabs{
  display:flex;
  gap:7px;
  margin-top:13px;
}

.tab{
  flex:1;
  height:37px;
  border:0;
  border-radius:10px;
  background:#f1f5f4;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
}

.tab.active{
  background:var(--turq);
  color:white;
}

.users{
  overflow-y:auto;
  flex:1;
}

.userItem{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 18px;
  cursor:pointer;
  border-bottom:1px solid #f1f4f3;
}

.userItem:hover{
  background:#f5fbfa;
}

.userItem.active{
  background:var(--turq-light);
}

.userInfo{
  min-width:0;
  flex:1;
}

.userName{
  font-weight:800;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.userStatus{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.onlineDot{
  width:9px;
  height:9px;
  background:#21c77a;
  border-radius:50%;
  flex-shrink:0;
}

.offlineDot{
  width:9px;
  height:9px;
  background:#c8d0ce;
  border-radius:50%;
  flex-shrink:0;
}

/* ==============================
   CHAT
============================== */

.chat{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#e9f0ee;
}

.chatHeader{
  min-height:75px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 20px;
}

.chatPerson{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.chatPersonInfo{
  min-width:0;
}

.chatPersonName{
  font-size:17px;
  font-weight:800;
}

.chatPersonStatus{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.callButtons{
  display:flex;
  gap:8px;
}

.iconBtn{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:#f1f7f5;
  cursor:pointer;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.iconBtn:hover{
  background:var(--turq-light);
}

.iconBtn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:25px;
  background:
    radial-gradient(circle at 10% 20%,rgba(16,191,163,.06),transparent 25%),
    radial-gradient(circle at 90% 80%,rgba(16,191,163,.05),transparent 25%),
    #edf4f2;
}

.emptyChat{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--muted);
  padding:30px;
}

.emptyChat strong{
  display:block;
  color:var(--text);
  font-size:24px;
  margin-bottom:8px;
}

.messageRow{
  display:flex;
  margin-bottom:10px;
}

.messageRow.mine{
  justify-content:flex-end;
}

.message{
  max-width:min(70%,520px);
  padding:10px 13px;
  border-radius:16px;
  background:white;
  box-shadow:0 2px 6px rgba(0,0,0,.04);
}

.messageRow.mine .message{
  background:#d3f8ef;
  border-bottom-right-radius:4px;
}

.messageRow:not(.mine) .message{
  border-bottom-left-radius:4px;
}

.messageText{
  font-size:15px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
}

.messageTime{
  font-size:10px;
  color:#80908d;
  margin-top:4px;
  text-align:right;
}

.typing{
  height:22px;
  padding:0 22px;
  font-size:12px;
  color:var(--muted);
}

.composer{
  background:#fff;
  border-top:1px solid var(--border);
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:9px;
}

.composer input{
  flex:1;
  min-width:0;
  height:46px;
  border:0;
  background:#f3f7f6;
  border-radius:14px;
  outline:none;
  padding:0 15px;
  font-size:15px;
}

.sendBtn{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:var(--turq);
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

/* ==============================
   PROFILE MODAL
============================== */

.modal{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.5);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:24px;
  padding:25px;
  box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.modalTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modalTitle h2{
  font-size:21px;
}

.closeBtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#f1f5f4;
  cursor:pointer;
  font-size:18px;
}

.bigAvatar{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:0 auto 20px;
  background:var(--turq-light);
  color:var(--turq-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:40px;
  font-weight:900;
}

.bigAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.field{
  margin-top:15px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input{
  width:100%;
  height:46px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 13px;
  outline:none;
}

.saveProfile{
  width:100%;
  margin-top:20px;
  background:var(--turq);
  color:#fff;
}

/* ==============================
   CALL SCREEN
============================== */

.callScreen{
  position:fixed;
  inset:0;
  z-index:8000;
  background:#061b18;
  color:#fff;
  display:none;
  flex-direction:column;
}

.callScreen.show{
  display:flex;
}

.callTop{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.callVideos{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#102a27;
}

.localVideo{
  position:absolute;
  right:20px;
  top:20px;
  width:180px;
  height:130px;
  border-radius:16px;
  object-fit:cover;
  background:#203b37;
  border:2px solid rgba(255,255,255,.5);
  z-index:2;
}

.callAvatar{
  width:110px;
  height:110px;
  border-radius:50%;
  background:var(--turq);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:900;
}

.callName{
  margin-top:15px;
  font-size:22px;
  font-weight:800;
}

.callState{
  margin-top:6px;
  color:#a9c0bc;
}

.callControls{
  min-height:105px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  padding:15px;
}

.callControl{
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  background:#203c38;
  color:#fff;
  font-size:21px;
}

.callControl.active{
  background:#fff;
  color:#132421;
}

.callControl.end{
  background:#e74c3c;
  color:white;
}

/* ==============================
   INCOMING CALL
============================== */

.incoming{
  position:fixed;
  inset:0;
  z-index:9000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(3,19,17,.82);
  padding:20px;
}

.incoming.show{
  display:flex;
}

.incomingBox{
  width:100%;
  max-width:360px;
  background:white;
  color:var(--text);
  border-radius:25px;
  padding:30px;
  text-align:center;
}

.incomingAvatar{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:0 auto 15px;
  background:var(--turq-light);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:var(--turq-dark);
  font-size:30px;
  font-weight:900;
}

.incomingAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.incomingBox h2{
  margin-bottom:7px;
}

.incomingBox p{
  color:var(--muted);
  margin-bottom:25px;
}

.incomingActions{
  display:flex;
  gap:10px;
}

.incomingActions button{
  flex:1;
}

.accept{
  background:#20bd72;
  color:white;
}

.reject{
  background:#e74c3c;
  color:white;
}

/* ==============================
   MOBILE
============================== */

.mobileBack{
  display:none;
}

@media(max-width:800px){

  .room{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:flex;
  }

  .chat{
    display:none;
  }

  .room.chatOpen .sidebar{
    display:none;
  }

  .room.chatOpen .chat{
    display:flex;
  }

  .mobileBack{
    display:flex;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f2f7f6;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    margin-right:5px;
  }

  .message{
    max-width:82%;
  }

  .localVideo{
    width:120px;
    height:95px;
    right:10px;
    top:10px;
  }

  .chatHeader{
    padding:10px 12px;
  }

  .messages{
    padding:15px;
  }
}

/* ==============================
   TOAST
============================== */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:#152320;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:10000;
  font-size:14px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen">

  <div class="loginBox">

    <div class="logo">Z</div>

    <h1>ZIQVONA</h1>

    <p>
      Konekte ak moun ou vle yo,
      chat prive, voice ak video.
    </p>

    <input
      id="usernameInput"
      class="input"
      maxlength="40"
      autocomplete="username"
      placeholder="Antre non ou..."
    >

    <button
      id="loginBtn"
      class="btn btn-primary"
    >
      Konekte
    </button>

    <div id="loginError" class="error"></div>

  </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="app">

  <div id="room" class="room">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sideTop">

        <div class="brandRow">

          <div class="brand">

            <div class="brandLogo">Z</div>

            <div class="brandName">
              ZIQVONA
            </div>

          </div>

          <div
            id="myProfileMini"
            class="profileMini"
            title="Pwofil mwen"
          >

            <div
              id="myAvatar"
              class="avatar"
            >
              Z
            </div>

          </div>

        </div>

        <div class="search">

          <span>🔎</span>

          <input
            id="searchInput"
            placeholder="Chèche moun..."
          >

        </div>

        <div class="tabs">

          <button
            class="tab active"
            data-filter="all"
          >
            Tout
          </button>

          <button
            class="tab"
            data-filter="online"
          >
            Online
          </button>

        </div>

      </div>

      <div
        id="usersList"
        class="users"
      ></div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

      <header class="chatHeader">

        <div class="chatPerson">

          <button
            id="mobileBack"
            class="mobileBack"
          >
            ←
          </button>

          <div
            id="chatAvatar"
            class="avatar"
          >
            Z
          </div>

          <div class="chatPersonInfo">

            <div
              id="chatName"
              class="chatPersonName"
            >
              Chwazi yon moun
            </div>

            <div
              id="chatStatus"
              class="chatPersonStatus"
            >
              Chwazi yon moun pou kòmanse
            </div>

          </div>

        </div>

        <div class="callButtons">

          <button
            id="audioCallBtn"
            class="iconBtn"
            title="Voice call"
            disabled
          >
            📞
          </button>

          <button
            id="videoCallBtn"
            class="iconBtn"
            title="Video call"
            disabled
          >
            🎥
          </button>

        </div>

      </header>


      <section
        id="messages"
        class="messages"
      >

        <div class="emptyChat">

          <div>

            <strong>
              Byenvini nan ZIQVONA
            </strong>

            Chwazi yon moun sou bò gòch la
            pou kòmanse yon chat prive.

          </div>

        </div>

      </section>


      <div
        id="typing"
        class="typing"
      ></div>


      <div class="composer">

        <input
          id="messageInput"
          placeholder="Ekri mesaj..."
          autocomplete="off"
          disabled
        >

        <button
          id="sendBtn"
          class="sendBtn"
          disabled
        >
          ➤
        </button>

      </div>

    </main>

  </div>

</div>


<!-- =====================================================
     PROFILE MODAL
===================================================== -->

<div
  id="profileModal"
  class="modal"
>

  <div class="modalBox">

    <div class="modalTitle">

      <h2>Pwofil mwen</h2>

      <button
        id="closeProfile"
        class="closeBtn"
      >
        ✕
      </button>

    </div>

    <div
      id="profileAvatarPreview"
      class="bigAvatar"
    >
      Z
    </div>

    <div class="field">

      <label>
        Foto profil
      </label>

      <input
        id="avatarInput"
        type="file"
        accept="image/*"
      >

    </div>

    <div class="field">

      <label>
        Status
      </label>

      <input
        id="statusInput"
        maxlength="120"
        placeholder="Ekri yon ti status..."
      >

    </div>

    <button
      id="saveProfile"
      class="btn saveProfile"
    >
      Sove pwofil
    </button>

  </div>

</div>


<!-- =====================================================
     CALL SCREEN
===================================================== -->

<div
  id="callScreen"
  class="callScreen"
>

  <div class="callTop">
    <div>
      <span id="callTypeLabel">
        Apèl
      </span>
    </div>
  </div>

  <div class="callVideos">

    <div
      id="callCenter"
      style="
        position:absolute;
        z-index:1;
        text-align:center;
      "
    >

      <div
        id="callAvatar"
        class="callAvatar"
      >
        Z
      </div>

      <div
        id="callName"
        class="callName"
      >
        ZIQVONA
      </div>

      <div
        id="callState"
        class="callState"
      >
        Ap rele...
      </div>

    </div>

    <video
      id="remoteVideo"
      class="remoteVideo"
      autoplay
      playsinline
    ></video>

    <video
      id="localVideo"
      class="localVideo"
      autoplay
      muted
      playsinline
    ></video>

  </div>

  <div class="callControls">

    <button
      id="muteBtn"
      class="callControl"
      title="Mute"
    >
      🎙️
    </button>

    <button
      id="cameraBtn"
      class="callControl"
      title="Camera"
    >
      📷
    </button>

    <button
      id="endCallBtn"
      class="callControl end"
      title="Fini apèl"
    >
      ☎
    </button>

  </div>

</div>


<!-- =====================================================
     INCOMING CALL
===================================================== -->

<div
  id="incomingCall"
  class="incoming"
>

  <div class="incomingBox">

    <div
      id="incomingAvatar"
      class="incomingAvatar"
    >
      Z
    </div>

    <h2 id="incomingName">
      ZIQVONA
    </h2>

    <p id="incomingType">

/* =====================================================
   HELPERS
===================================================== */

function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}


function initials(name){

  if(!name){
    return "Z";
  }

  const parts = name.trim().split(/\s+/);

  if(parts.length === 1){
    return parts[0].slice(0,1).toUpperCase();
  }

  return (
    parts[0].slice(0,1) +
    parts[1].slice(0,1)
  ).toUpperCase();
}


function escapeHtml(text){

  const div = document.createElement("div");

  div.textContent = text || "";

  return div.innerHTML;
}


function formatTime(dateString){

  const date = new Date(dateString);

  if(Number.isNaN(date.getTime())){
    return "";
  }

  return date.toLocaleTimeString([], {
    hour:"2-digit",
    minute:"2-digit"
  });
}


/* =====================================================
   AVATAR
===================================================== */

function renderAvatar(element, username, profile){

  element.innerHTML = "";

  if(profile && profile.avatar){

    const img =
      document.createElement("img");

    img.src = profile.avatar;

    img.alt = username || "ZIQVONA";

    img.onerror = () => {
      element.innerHTML =
        initials(username);
    };

    element.appendChild(img);

  }else{

    element.textContent =
      initials(username);

  }
}

   LOGIN
===================================================== */

loginBtn.addEventListener("click", login);

usernameInput.addEventListener("keydown", event => {

  if(event.key === "Enter"){
    login();
  }

});


function login(){

  const username =
    usernameInput.value.trim();

  if(!username){

    loginError.textContent =
      "Tanpri antre non ou.";

    return;
  }

  if(username.length < 2){

    loginError.textContent =
      "Non an dwe gen omwen 2 karaktè.";

    return;
  }

  loginError.textContent = "";

  loginBtn.disabled = true;

  loginBtn.textContent =
    "Koneksyon...";

  socket.emit("user:login", {
    username
  });
}

   LOGIN SUCCESS
===================================================== */

  currentProfile =

      avatar:"",
      status:""

    data.users || [];

  loginBtn.disabled = false;

  loginBtn.textContent =
    "Konekte";

});

  setTimeout(() => {
    location.reload();
  }, 1500);

});


/* =====================================================
   USERS
===================================================== */

socket.on("users:update", users => {

  allUsers =
    Array.isArray(users)
      ? users
      : [];

  renderUsers();

});


socket.on("user:online", data => {

  showToast(
    `${data.username} konekte.`
  );

});


socket.on("user:offline", data => {

  if(
    selectedUser &&
    selectedUser.username === data.username
  ){

    chatStatus.textContent =
      "offline";

  }

});


function renderUsers(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  usersList.innerHTML = "";

  let filtered =
    allUsers.filter(user => {

      if(
        user.username.toLowerCase() ===
        currentUser.toLowerCase()
      ){
        return false;
      }

      if(
        currentFilter === "online" &&
        !user.online
      ){
        return false;
      }

      if(
        query &&
        !user.username.toLowerCase().includes(query)
      ){
        return false;
      }

      return true;
    });


  filtered.sort((a,b) => {

    if(a.online !== b.online){
      return a.online ? -1 : 1;
    }

    return a.username.localeCompare(
      b.username
    );
  });


  if(filtered.length === 0){

    usersList.innerHTML = `
      <div style="
        padding:30px 20px;
        text-align:center;
        color:#70807d;
        font-size:14px;
      ">
        Pa gen itilizatè pou montre.
      </div>
    `;

    return;
  }


  filtered.forEach(user => {

    const item =
      document.createElement("div");

    item.className =
      "userItem" +
      (
        selectedUser &&
        selectedUser.username === user.username
          ? " active"
          : ""
      );

    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";

    renderAvatar(
      avatar,
      user.username,
      user.profile
    );


    const info =
      document.createElement("div");

    info.className =
      "userInfo";


    const name =
      document.createElement("div");

    name.className =
      "userName";

    name.textContent =
      user.username;


    const status =
      document.createElement("div");

    status.className =
      "userStatus";

    status.textContent =
      user.profile?.status ||
      (
        user.online
          ? "Online"
          : "Offline"
      );


    info.appendChild(name);

    info.appendChild(status);


    const dot =
      document.createElement("div");

    dot.className =
      user.online
        ? "onlineDot"
        : "offlineDot";


    item.appendChild(avatar);

    item.appendChild(info);

    item.appendChild(dot);


    item.addEventListener(
      "click",
      () => selectUser(user)
    );


    usersList.appendChild(item);

  });

}


searchInput.addEventListener(
  "input",
  renderUsers
);


document.querySelectorAll(".tab")
.forEach(tab => {

/* =====================================================
   SELECT USER
===================================================== */

  chatStatus.textContent =

  `;

}


/* =====================================================
   CHAT HISTORY
===================================================== */

socket.on("chat:history", data => {

  if(
    !selectedUser ||
    data.with !== selectedUser.username
  ){
    return;
  }

  messages.innerHTML = "";

  const list =
    Array.isArray(data.messages)
      ? data.messages
      : [];

  if(list.length === 0){

    messages.innerHTML = `
      <div class="emptyChat">
        <div>
          <strong>
            Kòmanse konvèsasyon an
          </strong>
          Voye premye mesaj la.
        </div>
      </div>
    `;

    return;
  }

  list.forEach(renderMessage);

  scrollMessages();

});


/* =====================================================
   SEND MESSAGE
===================================================== */

sendBtn.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

      return;
    }

  }
);


messageInput.addEventListener(
  "input",
  () => {

    if(!selectedUser){
      return;
    }

    socket.emit("typing:start", {
      to:selectedUser.username
    });

    clearTimeout(typingTimer);

    typingTimer =
      setTimeout(() => {

        socket.emit("typing:stop", {
          to:selectedUser.username
        });

      }, 800);

  }
);


function sendMessage(){

  if(!selectedUser){
    showToast(
      "Chwazi yon moun dabò."
    );
    return;
  }

  const text =
    messageInput.value.trim();

  if(!text){
    return;
  }

  socket.emit("message:send", {
    to:selectedUser.username,
    text
  });

  messageInput.value = "";

  socket.emit("typing:stop", {
    to:selectedUser.username
  });
}


socket.on("message:new", message => {

  if(
    !selectedUser
  ){
    return;
  }

  const belongsToCurrentChat =
    (
      message.from === currentUser &&
      message.to === selectedUser.username
    ) ||
    (
      message.from === selectedUser.username &&
      message.to === currentUser
    );

  if(!belongsToCurrentChat){
    return;
  }

  const empty =
    messages.querySelector(".emptyChat");

  if(empty){
    messages.innerHTML = "";
  }

  renderMessage(message);

  scrollMessages();

});


socket.on("message:error", data => {

  showToast(
    data?.message ||
    "Mesaj la pa voye."
  );

});


function renderMessage(message){

  const row =
    document.createElement("div");

  row.className =
    "messageRow" +
    (
      message.from === currentUser
        ? " mine"
        : ""
    );


  const bubble =
    document.createElement("div");

  bubble.className =
    "message";


  const text =
    document.createElement("div");

  text.className =
    "messageText";

  text.textContent =
    message.text || "";


  const time =
    document.createElement("div");

  time.className =
    "messageTime";

  time.textContent =
    formatTime(message.createdAt);


  bubble.appendChild(text);

  bubble.appendChild(time);

  row.appendChild(bubble);

  messages.appendChild(row);
}


function scrollMessages(){

   AUDIO CALL
===================================================== */

videoCallBtn.addEventListener(

async function startCall(type){

  if(!selectedUser){
    showToast(
      "Chwazi yon moun dabò."
    );
    return;
  }

  if(!selectedUser.online){
    showToast(
      "Moun sa a offline."
    );
    return;
  }

  try{

    currentCall = {
      callId:null,
      from:currentUser,
      to:selectedUser.username,
      type,
      incoming:false
    };

    showCallScreen(
      selectedUser.username,
      type,
      selectedUser.profile
    );

    await prepareLocalMedia(type);

    socket.emit("call:start", {
      to:selectedUser.username,
      type
    });

  }catch(error){

    console.error(
      "CALL START ERROR:",
      error
    );

    endLocalCall(false);

    showToast(
      "Mikwo/kamera pa disponib."
    );

  }
}


/* =====================================================
   CALL STARTED
===================================================== */

socket.on("call:started", async data => {

  currentCall.callId =
    data.callId;

  currentCall.to =
    data.to;

  currentCall.type =
    data.type;

  callState.textContent =
    "Ap tann moun nan aksepte...";

});


/* =====================================================
   INCOMING CALL
===================================================== */

socket.on("call:incoming", data => {

  if(!currentUser){
    return;
  }

  currentCall = {
    callId:data.callId,
    from:data.from,
    to:currentUser,
    type:data.type,
    incoming:true
  };

  pendingCaller =
    data.from;

  pendingOffer = null;

  incomingName.textContent =
    data.from;

  incomingType.textContent =
    data.type === "video"
      ? "🎥 Apèl video k ap vini..."
      : "📞 Apèl vocal k ap vini...";


  renderAvatar(
    incomingAvatar,
    data.from,
    data.profile
  );

  incomingCall.classList.add(
    "show"
  );

});


/* =====================================================
   ACCEPT CALL
===================================================== */

acceptCall.addEventListener(
  "click",
  acceptIncomingCall
);


async function acceptIncomingCall(){

  if(!pendingCaller){
    return;
  }

  const caller =
    pendingCaller;

  const type =
    currentCall.type;

  incomingCall.classList.remove(
    "show"
  );

  try{

    showCallScreen(
      caller,
      type,
      findUserProfile(caller)
    );

    await prepareLocalMedia(type);

    socket.emit("call:accept", {
      callId:currentCall.callId,
      from:caller
    });

    callState.textContent =
      "Konekte...";

    if(pendingOffer){

      await createPeerConnection(
        caller,
        type
      );

      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(
          pendingOffer
        )
      );

      const answer =
        await peerConnection.createAnswer();

      await peerConnection.setLocalDescription(
        answer
      );

      socket.emit("webrtc:answer", {
        to:caller,
        answer,
        callId:currentCall.callId
      });

      pendingOffer = null;
    }

  }catch(error){

    console.error(
      "ACCEPT CALL ERROR:",
      error
    );

    showToast(
      "Apèl la pa ka kòmanse."
    );

    endLocalCall(false);

  }

}


/* =====================================================
   REJECT CALL
===================================================== */

rejectCall.addEventListener(
  "click",
  () => {

    const caller =
      pendingCaller;

    incomingCall.classList.remove(
      "show"
    );

    if(caller){

      socket.emit("call:reject", {
        callId:currentCall.callId,
        from:caller
      });

    }

    pendingCaller = null;

    pendingOffer = null;

    currentCall = {
      callId:null,
      from:null,
      to:null,
      type:null,
      incoming:false
    };

  }
);


socket.on("call:rejected", data => {

  callState.textContent =
    "Apèl la te refize.";

  setTimeout(() => {
    endLocalCall(false);
  }, 1000);

  showToast(
    `${data.from} pa aksepte apèl la.`
  );

});


/* =====================================================
   CALL ACCEPTED
===================================================== */

socket.on("call:accepted", async data => {

  try{

    currentCall.to =
      data.from;

    callState.textContent =
      "Koneksyon...";

    await createPeerConnection(
      data.from,
      currentCall.type
    );

    const offer =
      await peerConnection.createOffer({
        offerToReceiveAudio:true,
        offerToReceiveVideo:
          currentCall.type === "video"
      });

    await peerConnection.setLocalDescription(
      offer
    );

    socket.emit("webrtc:offer", {
      to:data.from,
      offer,
      callId:currentCall.callId
    });

  }catch(error){

    console.error(
      "CALL ACCEPTED ERROR:",
      error
    );

    showToast(
      "Pa kapab etabli koneksyon an."
    );

    endLocalCall(false);

  }

});


/* =====================================================
   MEDIA
===================================================== */

async function prepareLocalMedia(type){

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => track.stop());

    localStream = null;
  }

  const constraints = {
    audio:true,
    video:
      type === "video"
  };

  localStream =
    await navigator.mediaDevices
      .getUserMedia(
        constraints
      );

  localVideo.srcObject =
    localStream;

  localVideo.style.display =
    type === "video"
      ? "block"
      : "none";

  videoEnabled =
    type === "video";

  audioEnabled = true;

}


/* =====================================================
   WEBRTC CONFIG
===================================================== */

const rtcConfig = {

  iceServers:[
    {
      urls:[
        "stun:stun.l.google.com:19302",
        "stun:stun1.l.google.com:19302"
      ]
    }
  ]

};


/* =====================================================
   CREATE PEER
===================================================== */

async function createPeerConnection(
  target,
  type
){

  if(peerConnection){

    try{
      peerConnection.close();
    }catch(e){}

  }

  peerConnection =
    new RTCPeerConnection(
      rtcConfig
    );


  remoteStream =
    new MediaStream();

  remoteVideo.srcObject =
    remoteStream;


  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });

  }


  peerConnection.onicecandidate =
    event => {

      if(
        event.candidate
      ){

        socket.emit(
          "webrtc:ice-candidate",
          {
            to:target,
            candidate:event.candidate,
            callId:currentCall.callId
          }
        );

      }

    };


  peerConnection.ontrack =
    event => {

      event.streams[0]
        ?.getTracks()
        .forEach(track => {

          remoteStream.addTrack(
            track
          );

        });

      remoteVideo.style.display =
        type === "video"
          ? "block"
          : "none";

      callState.textContent =
        "Apèl konekte.";

      callCenter.style.display =
        type === "video"
          ? "none"
          : "block";

    };


  peerConnection.onconnectionstatechange =
    () => {

      console.log(
        "WebRTC state:",
        peerConnection.connectionState
      );


      if(
        peerConnection.connectionState ===
        "connected"
      ){

        callState.textContent =
          "Apèl konekte.";

      }


      if(
        peerConnection.connectionState ===
        "failed"
      ){

        showToast(
          "Koneksyon apèl la echwe."
        );

      }


      if(
        peerConnection.connectionState ===
        "disconnected"
      ){

        callState.textContent =
          "Koneksyon koupe...";

      }

    };

}


/* =====================================================
   WEBRTC OFFER
===================================================== */

socket.on("webrtc:offer", async data => {

  try{

    if(
      !currentCall.incoming &&
      !currentCall.to
    ){
      return;
    }

    if(
      currentCall.incoming &&
      !pendingCaller
    ){
      return;
    }


    if(
      currentCall.incoming
    ){

      pendingOffer =
        data.offer;

      currentCall.callId =
        data.callId ||
        currentCall.callId;

      /*
        Si itilizatè a poko klike Accept,
        nou sere offer la.
      */

      if(
        !peerConnection
      ){
        return;
      }

    }


    if(
      !peerConnection
    ){

      await createPeerConnection(
        data.from,
        currentCall.type
      );

    }


    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );


    const answer =
      await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(
      answer
    );


    socket.emit(
      "webrtc:answer",
      {
        to:data.from,
        answer,
        callId:data.callId ||
          currentCall.callId
      }
    );


  }catch(error){

    console.error(
      "WEBRTC OFFER ERROR:",
      error
    );

  }

});


/* =====================================================
   WEBRTC ANSWER
===================================================== */

socket.on("webrtc:answer", async data => {

  try{

    if(!peerConnection){
      return;
    }

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

    callState.textContent =
      "Apèl konekte.";

  }catch(error){

    console.error(
      "WEBRTC ANSWER ERROR:",
      error
    );

  }

});


/* =====================================================
   ICE CANDIDATE
===================================================== */

socket.on(
  "webrtc:ice-candidate",
  async data => {

    try{

      if(!data.candidate){
        return;
      }

      if(!peerConnection){

        /*
          Candidate ka rive avan
          PeerConnection pare.
        */

        return;
      }

      await peerConnection.addIceCandidate(
        new RTCIceCandidate(
          data.candidate
        )
      );

    }catch(error){

      console.error(
        "ICE ERROR:",
        error
      );

    }

  }
);


/* =====================================================
   CALL UI
===================================================== */

function showCallScreen(
  username,
  type,
  profile
){

  callName.textContent =
    username;

  callTypeLabel.textContent =
    type === "video"
      ? "Apèl video"
      : "Apèl vocal";

  callState.textContent =
    "Ap rele...";

  renderAvatar(
    callAvatar,
    username,
    profile
  );

  callScreen.classList.add(
    "show"
  );

  callCenter.style.display =
    type === "video"
      ? "none"
      : "block";

  remoteVideo.style.display =
    "none";

  localVideo.style.display =
    type === "video"
      ? "block"
      : "none";

}


function findUserProfile(username){

  const user =
    allUsers.find(
      item =>
        item.username === username
    );

  return user?.profile || {
    avatar:"",
    status:""
  };

}


/* =====================================================
   END CALL
===================================================== */

endCallBtn.addEventListener(
  "click",
  () => {

    const target =
      currentCall.incoming
        ? currentCall.from
        : currentCall.to;

    if(target){

      socket.emit("call:end", {
        callId:currentCall.callId,
        to:target
      });

    }

    endLocalCall(true);

  }
);


socket.on("call:ended", data => {

  showToast(
    "Apèl la fini."
  );

  endLocalCall(false);

});


function endLocalCall(notify){

  if(
    notify &&
    currentCall.to
  ){

    socket.emit("call:end", {
      callId:currentCall.callId,
      to:currentCall.to
    });

  }


  if(peerConnection){

    try{
      peerConnection.close();
    }catch(e){}

    peerConnection = null;
  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

    localStream = null;
  }


  remoteStream = null;

  localVideo.srcObject =
    null;

  remoteVideo.srcObject =
    null;


  callScreen.classList.remove(
    "show"
  );


  incomingCall.classList.remove(
    "show"
  );


  pendingOffer = null;

  pendingCaller = null;


  currentCall = {
    callId:null,
    from:null,
    to:null,
    type:null,
    incoming:false
  };


  audioEnabled = true;

  videoEnabled = true;

}


/* =====================================================
   MUTE
===================================================== */

muteBtn.addEventListener(
  "click",
  () => {

    if(!localStream){
      return;
    }

    const tracks =
      localStream.getAudioTracks();

    if(tracks.length === 0){
      return;
    }

    audioEnabled =
      !audioEnabled;

    tracks.forEach(
      track =>
        track.enabled =
          audioEnabled
    );

    muteBtn.classList.toggle(
      "active",
      !audioEnabled
    );

    muteBtn.textContent =
      audioEnabled
        ? "🎙️"
        : "🔇";

  }
);


/* =====================================================
   CAMERA
===================================================== */

cameraBtn.addEventListener(
  "click",
  () => {

    if(!localStream){
      return;
    }

    const tracks =
      localStream.getVideoTracks();

    if(tracks.length === 0){
      return;
    }

    videoEnabled =
      !videoEnabled;

    tracks.forEach(
      track =>
        track.enabled =
          videoEnabled
    );

    cameraBtn.classList.toggle(
      "active",
      !videoEnabled
    );

    cameraBtn.textContent =
      videoEnabled
        ? "📷"
        : "🚫";

  }
);

===================================================== */

      localStream
        .getTracks()
        .forEach(track =>
          track.stop()

    }

);
