<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#10bfa3">
<meta name="description" content="ZIQVONA — Better vibes • One family">
<link rel="manifest" href="/manifest.json">
<title>ZIQVONA — Better vibes • One family</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef5f3;
  color:#172321;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  overflow:hidden;
}

.sidebar{
  width:360px;
  min-width:360px;
  height:100%;
  background:#fff;
  border-right:1px solid #e1ebe8;
  display:flex;
  flex-direction:column;
}

.brand{
  padding:18px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #edf2f1;
}

.logo{
  width:48px;
  height:48px;
  border-radius:15px;
  background:#10bfa3;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:900;
}

.brand strong{
  display:block;
  font-size:20px;
}

.brand small{
  display:block;
  color:#7d8c89;
  margin-top:3px;
}

.profile-bar{
  padding:14px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#f7fbfa;
}

.avatar{
  width:46px;
  height:46px;
  min-width:46px;
  border-radius:50%;
  background:#10bfa3;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info{
  min-width:0;
  flex:1;
}

.profile-info strong,
.profile-info span{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile-info span{
  color:#7d8b89;
  font-size:13px;
  margin-top:3px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#f1f6f4;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:#ddf6f0;
}

.search{
  padding:13px;
}

.search input{
  width:100%;
  border:1px solid #dce8e5;
  border-radius:13px;
  padding:12px 14px;
  outline:none;
}

.search input:focus{
  border-color:#10bfa3;
}

.filters{
  display:flex;
  gap:8px;
  padding:0 13px 13px;
}

.filter{
  border:0;
  padding:8px 13px;
  border-radius:20px;
  background:#edf3f1;
}

.filter.active{
  color:#fff;
  background:#10bfa3;
}

.user-list{
  flex:1;
  overflow:auto;
}

.user-item{
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #f0f4f3;
  cursor:pointer;
}

.user-item:hover,
.user-item.active{
  background:#effaf7;
}

.user-info{
  min-width:0;
  flex:1;
}

.user-info strong,
.user-info span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user-info span{
  color:#7d8b89;
  font-size:13px;
  margin-top:3px;
}

.online-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#10bfa3;
}

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
}

.chat-header{
  min-height:72px;
  background:#fff;
  border-bottom:1px solid #e0ebe8;
  padding:11px 16px;
  display:flex;
  align-items:center;
  gap:11px;
}

.chat-info{
  flex:1;
  min-width:0;
}

.chat-info strong,
.chat-info span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-info span{
  color:#7c8b88;
  font-size:13px;
  margin-top:3px;
}

.chat-actions{
  display:flex;
  gap:6px;
}

.messages{
  flex:1;
  overflow:auto;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.empty{
  margin:auto;
  text-align:center;
  color:#7c8b88;
  max-width:320px;
  line-height:1.5;
}

.message{
  max-width:min(75%,600px);
  background:#fff;
  padding:9px 12px;
  border-radius:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.03);
}

.message.mine{
  align-self:flex-end;
  background:#d8f8f0;
  border-bottom-right-radius:4px;
}

.message.theirs{
  align-self:flex-start;
  border-bottom-left-radius:4px;
}

.message-text{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-time{
  text-align:right;
  font-size:10px;
  color:#8a9794;
  margin-top:5px;
}

.message-media{
  max-width:320px;
  border-radius:12px;
  display:block;
}

.message audio{
  max-width:300px;
}

.composer{
  background:#fff;
  border-top:1px solid #e0ebe8;
  padding:10px;
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.composer textarea{
  flex:1;
  min-height:44px;
  max-height:130px;
  resize:none;
  border:1px solid #dce8e5;
  border-radius:13px;
  padding:12px;
  outline:none;
}

.composer textarea:focus{
  border-color:#10bfa3;
}

.send{
  width:47px;
  height:44px;
  border:0;
  border-radius:13px;
  background:#10bfa3;
  color:#fff;
  font-size:18px;
}

.network{
  position:fixed;
  left:360px;
  right:0;
  bottom:0;
  z-index:20;
  padding:5px;
  text-align:center;
  font-size:11px;
}

.network.online{
  background:#dff8f1;
  color:#147863;
}

.network.offline{
  background:#fff0d7;
  color:#8b651e;
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-card{
  width:min(430px,100%);
  background:#fff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 20px 70px rgba(0,0,0,.2);
}

.modal-card h2{
  margin:0 0 8px;
}

.modal-card p{
  color:#7d8b89;
  line-height:1.5;
}

.field{
  margin:13px 0;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
}

.field input{
  width:100%;
  padding:12px;
  border:1px solid #dce8e5;
  border-radius:12px;
  outline:none;
}

.primary{
  width:100%;
  padding:12px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:#10bfa3;
  margin-top:8px;
}

.secondary{
  width:100%;
  padding:12px;
  border:0;
  border-radius:12px;
  background:#edf3f1;
  margin-top:8px;
}

.call-screen{
  position:fixed;
  inset:0;
  z-index:200;
  background:#10211e;
  color:#fff;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.call-screen.show{
  display:flex;
}

.call-title{
  text-align:center;
}

.call-title h2{
  margin:5px 0;
}

.call-title p{
  margin:0;
  color:#b9cbc7;
}

.call-media{
  width:min(900px,95vw);
  margin-top:18px;
  position:relative;
  display:flex;
  justify-content:center;
}

.remote-video{
  width:100%;
  max-height:62vh;
  background:#000;
  border-radius:18px;
  object-fit:contain;
}

.local-video{
  position:absolute;
  right:14px;
  bottom:14px;
  width:160px;
  max-height:180px;
  background:#000;
  border-radius:12px;
  border:2px solid #fff;
  object-fit:cover;
}

.voice-call .remote-video,
.voice-call .local-video{
  display:none;
}

.call-avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  background:#10bfa3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:900;
  margin-top:25px;
}

.hangup{
  margin-top:25px;
  width:62px;
  height:62px;
  border:0;
  border-radius:50%;
  background:#e45454;
  color:#fff;
  font-size:24px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:300;
  background:#162622;
  color:#fff;
  padding:11px 17px;
  border-radius:12px;
  display:none;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}

@media(max-width:800px){

  .app{
    position:relative;
  }

  .sidebar{
    width:100%;
    min-width:0;
  }

  .main{
    display:none;
    position:absolute;
    inset:0;
    background:#eef5f3;
    z-index:10;
  }

  .app.chat-open .sidebar{
    display:none;
  }

  .app.chat-open .main{
    display:flex;
  }

  .network{
    left:0;
  }

  .message{
    max-width:86%;
  }

  .local-video{
    width:110px;
  }
}
</style>
</head>

<body>

<script src="/socket.io/socket.io.js"></script>

<script>
(() => {

'use strict';

/* =========================
   ELEMENTS
========================= */

const $ = id =>
  document.getElementById(id);

/* =========================
   SOCKET
========================= */

const socket = io({
  transports: ['websocket', 'polling'],
  autoConnect: false
});

/* =========================
   STATE
========================= */

let me = null;

let activeUser = null;

let profiles = {};

let chats = {};

let unread = {};

let currentFilter = 'all';

let localStream = null;

let peerConnection = null;

let callTarget = null;

let callType = null;

let pendingCandidates = [];

const STORAGE = {
  ME: 'ziqvona_me',
  PROFILES: 'ziqvona_profiles',
  CHATS: 'ziqvona_chats',
  UNREAD: 'ziqvona_unread'
};

/* =========================
   STORAGE
========================= */

function loadJSON(key, fallback){

  try{

    const value =
      localStorage.getItem(key);

    return value
      ? JSON.parse(value)
      : fallback;

  }catch{

    return fallback;
  }
}

function saveJSON(key, value){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  }catch(error){

    console.warn(
      'Storage error',
      error
    );
  }
}

/* =========================
   TOAST
========================= */

let toastTimer;

function toast(message){

  const el = $('toast');

  el.textContent = message;

  el.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      () => {
        el.classList.remove('show');
      },
      3000
    );
}

/* =========================
   NETWORK
========================= */

function updateNetwork(){

  const el =
    $('network');

  if(navigator.onLine){

    el.textContent =
      socket.connected
        ? 'Konekte ak ZIQVONA'
        : 'Ap konekte...';

    el.className =
      'network online';

  }else{

    el.textContent =
      'Ou offline';

    el.className =
      'network offline';
  }
}

/* =========================
   AVATAR
========================= */

function avatarHTML(profile){

  if(
    profile &&
    profile.avatar
  ){

    const safe =
      String(profile.avatar)
        .replace(/"/g, '&quot;');

    return `
      <img
        src="${safe}"
        alt=""
        onerror="this.style.display='none'">
    `;
  }

  const name =
    profile?.displayName ||
    profile?.username ||
    'Z';

  return escapeHTML(
    name
      .charAt(0)
      .toUpperCase()
  );
}

function escapeHTML(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

/* =========================
   LOGIN
========================= */

function showLogin(){

  $('loginModal')
    .classList.remove('hidden');
}

function hideLogin(){

  $('loginModal')
    .classList.add('hidden');
}

function login(){

  const username =
    $('loginName')
      .value
      .trim();

  if(
    username.length < 2
  ){

    toast(
      'Non an dwe gen omwen 2 karaktè.'
    );

    return;
  }

  localStorage.setItem(
    STORAGE.ME,
    username
  );

  socket.connect();

  socket.once(
    'connect',
    () => {

      socket.emit(
        'register',
        {
          username
        }
      );
    }
  );
}

/* =========================
   REGISTERED
========================= */

socket.on(
  'registered',
  data => {

    me =
      data.me;

    profiles =
      {
        ...profiles,
        ...(data.profiles || {})
      };

    if(me){

      profiles[
        me.username
      ] = me;

      $('myName')
        .textContent =
        me.displayName;

      $('myStatus')
        .textContent =
        me.status;

      $('myAvatar')
        .innerHTML =
        avatarHTML(me);
    }

    hideLogin();

    saveJSON(
      STORAGE.PROFILES,
      profiles
    );

    refreshUserList();

    updateNetwork();
  }
);

/* =========================
   PRESENCE
========================= */

let onlineUsers = [];

socket.on(
  'presence',
  data => {

    onlineUsers =
      Array.isArray(
        data?.online
      )
        ? data.online
        : [];

    Object.keys(profiles)
      .forEach(username => {

        profiles[username] = {
          ...profiles[username],
          online:
            onlineUsers.includes(
              username
            )
        };

      });

    refreshUserList();

    updateHeader();
  }
);

/* =========================
   SEARCH
========================= */

let searchTimer;

$('searchInput')
  .addEventListener(
    'input',
    () => {

      clearTimeout(
        searchTimer
      );

      const query =
        $('searchInput')
          .value
          .trim();

      if(!query){

        refreshUserList();

        return;
      }

      searchTimer =
        setTimeout(
          () => {

            socket.emit(
              'search-users',
              { query }
            );

          },
          250
        );
    }
  );

socket.on(
  'search-results',
  results => {

    renderUsers(
      Array.isArray(results)
        ? results
        : []
    );
  }
);

/* =========================
   USER LIST
========================= */

function refreshUserList(){

  const list =
    Object.values(
      profiles
    )
    .filter(profile =>
      profile.username !==
      me?.username
    );

  let filtered =
    list;

  const query =
    $('searchInput')
      .value
      .trim()
      .toLowerCase();

  if(query){

    filtered =
      filtered.filter(
        profile =>
          profile.username
            .toLowerCase()
            .includes(query) ||
          profile.displayName
            .toLowerCase()
            .includes(query)
      );
  }

  if(
    currentFilter ===
    'unread'
  ){

    filtered =
      filtered.filter(
        profile =>
          Number(
            unread[
              profile.username
            ] || 0
          ) > 0
      );
  }

  renderUsers(
    filtered
  );
}

function renderUsers(list){

  const container =
    $('userList');

  container.innerHTML = '';

  if(!list.length){

    container.innerHTML = `
      <div
        style="
          padding:25px;
          text-align:center;
          color:#81908d">
        Pa gen moun pou montre.
      </div>
    `;

    return;
  }

  list.forEach(
    profile => {

      const item =
        document.createElement(
          'div'
        );

      item.className =
        'user-item' +
        (
          activeUser ===
          profile.username
            ? ' active'
            : ''

/* =========================
   OPEN CHAT
========================= */

function openChat(username){

  if(!profiles[username]){

    profiles[username] =
      {
        username,
        displayName:
          username,
        status:'Disponib',
        online:
          onlineUsers.includes(
            username
          )
      };
  }

  activeUser =
    username;

  unread[username] =
    0;

  saveJSON(
    STORAGE.UNREAD,
    unread
  );

  $('app')
    .classList.add(
      'chat-open'
    );

  $('backBtn')
    .style.display =
    'flex';

  updateHeader();

  renderMessages();

  socket.emit(
    'get-history',
    {
      with: username
    }
  );

  refreshUserList();
}

/* =========================
   HISTORY
========================= */

socket.on(
  'history',
  data => {

    if(
      !data?.with
    ){

      return;
    }

    chats[
      data.with
    ] =
      Array.isArray(
        data.messages
      )
        ? data.messages
        : [];

    saveJSON(
      STORAGE.CHATS,
      chats
    );

    if(
      activeUser ===
      data.with
    ){

      renderMessages();
    }
  }
);

/* =========================
   INCOMING MESSAGE
========================= */

socket.on(
  'private-message',
  message => {

    if(!message){

      return;
    }

    const other =
      message.from ===
      me?.username
        ? message.to
        : message.from;

    if(!chats[other]){

      chats[other] = [];
    }

    const exists =
      chats[other].some(
        item =>
          item.id ===
          message.id
      );

    if(!exists){

      chats[other].push(
        message
      );
    }

    chats[other] =
      chats[other].slice(
        -500
      );

    saveJSON(
      STORAGE.CHATS,
      chats
    );

    if(
      activeUser ===
      other
    ){

      renderMessages();

    }else{

      unread[other] =
        Number(
          unread[other] || 0
        ) + 1;

      saveJSON(
        STORAGE.UNREAD,
        unread
      );

      refreshUserList();
    }
  }
);

/* =========================
   MESSAGE RENDER
========================= */

function renderMessages(){

  const container =
    $('messages');

  container.innerHTML = '';

  if(!activeUser){

    container.innerHTML = `
      <div class="empty">
        Chwazi yon kontak pou kòmanse yon chat.
      </div>
    `;

    return;
  }

  const list =
    chats[
      activeUser
    ] || [];

  if(!list.length){

    container.innerHTML = `
      <div class="empty">
        Pa gen mesaj ankò.<br>
        Voye premye mesaj la.
      </div>
    `;

    return;
  }

  list.forEach(
    message => {

      const mine =
        message.from ===
        me?.username;

      const bubble =
        document.createElement(
          'div'
        );

      bubble.className =
        'message ' +
        (
          mine
            ? 'mine'
            : 'theirs'
        );

      let content = '';

      if(
        message.kind ===
        'image'
      ){

        content = `
          <img
            class="message-media"
            src="${escapeHTML(
              message.data
            )}"
            alt="Foto"
            loading="lazy">
        `;

      }else if(
        message.kind ===
        'video'
      ){

        content = `
          <video
            class="message-media"
            src="${escapeHTML(
              message.data
            )}"
            controls
            playsinline>
          </video>
        `;

      }else if(
        message.kind ===
        'voice'
      ){

        content = `
          <audio
            src="${escapeHTML(
              message.data
            )}"
            controls>
          </audio>
        `;

      }else{

        content = `
          <div class="message-text">
            ${escapeHTML(
              message.text || ''
            )}
          </div>
        `;
      }

      const time =
        message.time
          ? new Date(
              message.time
            ).toLocaleTimeString(
              [],
              {
                hour:'2-digit',
                minute:'2-digit'
              }
            )
          : '';

      bubble.innerHTML =
        content +
        `
          <div class="message-time">
            ${escapeHTML(time)}
          </div>
        `;

      container.appendChild(
        bubble
      );
    }
  );

  container.scrollTop =
    container.scrollHeight;
}

/* =========================
   MEDIA
========================= */

function readFileAsDataURL(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () =>
          resolve(
            reader.result
          );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );
    }
  );
}

async function sendMedia(file){

  if(!activeUser){

    toast(
      'Chwazi yon kontak dabò.'
    );

    return;
  }

  if(!socket.connected){

    toast(
      'Ou pa konekte.'
    );

    return;
  }

  if(
    file.size >
    12 * 1024 * 1024
  ){

    toast(
      'Fichye a twò gwo. Maksimòm 12MB.'
    );

    return;
  }

  let kind;

  if(
    file.type.startsWith(
      'image/'
    )
  ){

    kind =
      'image';

  }else if(
    file.type.startsWith(
      'video/'
    )
  ){

    kind =
      'video';

  }else if(
    file.type.startsWith(
      'audio/'
    )
  ){

    kind =
      'voice';

  }else{

    toast(
      'Kalite fichye sa a pa sipòte.'
    );

    return;
  }

  try{

    const data =
      await readFileAsDataURL(
        file
      );

    socket.emit(
      'media-message',
      {
        to:
          activeUser,

        kind,

        data
      }
    );

  }catch(error){

    console.error(
      error
    );

    toast(
      'Pa kapab li fichye a.'
    );
  }
}

async function getIceServers(){

  try{

    const response =
      await fetch(
        '/config'
      );

    if(
      !response.ok
    ){

      throw new Error(
        'Config error'
      );
    }

    return await response.json();

  }catch{

    return {
      iceServers:[
        {
          urls:
            'stun:stun.l.google.com:19302'
        }
      ]
    };
  }
}

/* =========================
   START CALL
========================= */

async function startCall(
  type
){

  if(!activeUser){

    toast(
      'Chwazi yon kontak dabò.'
    );

    return;
  }

  if(!socket.connected){

    toast(
      'Ou pa konekte.'
    );

    return;
  }

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    toast(
      'Navigatè a pa bay aksè kamera/mikwo.'
    );

    return;
  }

  callTarget =
    activeUser;

  callType =
    type;

  prepareCallScreen(
    type,
    callTarget
  );

  try{

    localStream =
      await navigator.mediaDevices
        .getUserMedia(
          type === 'video'
            ? {
                audio:true,
                video:true
              }
            : {
                audio:true,
                video:false
              }
        );

    $('localVideo')
      .srcObject =
      localStream;

    const config =
      await getIceServers();

    peerConnection =
      new RTCPeerConnection(
        config
      );

    localStream
      .getTracks()
      .forEach(
        track => {

          peerConnection
            .addTrack(
              track,
              localStream
            );
        }
      );

    setupPeerEvents();

    const offer =
      await peerConnection
        .createOffer();

    await peerConnection
      .setLocalDescription(
        offer
      );

    socket.emit(
      'call-offer',
      {
        to:
          callTarget,

        offer,

        type
      }
    );

    $('callState')
      .textContent =
      'Apèl ap sòti...';

  }catch(error){

    console.error(
      error
    );

    closeCall();

    toast(
      'Kamera oswa mikwo a pa disponib.'
    );
  }
}

/* =========================
   PEER EVENTS
========================= */

function setupPeerEvents(){

  if(!peerConnection){

    return;
  }

  peerConnection.onicecandidate =
    event => {

      if(
        event.candidate &&
        callTarget
      ){

        socket.emit(
          'ice-candidate',
          {
            to:
              callTarget,

            candidate:
              event.candidate
          }
        );
      }
    };

  peerConnection.ontrack =
    event => {

      const stream =
        event.streams?.[0];

      if(!stream){

        return;
      }

      $('remoteVideo')
        .srcObject =
        stream;

      $('remoteAudio')
        .srcObject =
        stream;

      $('remoteVideo')
        .play()
        .catch(
          () => {}
        );

      $('remoteAudio')
        .play()
        .catch(
          () => {}
        );

      $('callState')
        .textContent =
        'Konekte';
    };

  peerConnection.onconnectionstatechange =
    () => {

      if(!peerConnection){

        return;
      }

      const state =
        peerConnection
          .connectionState;

      if(
        state ===
        'connected'
      ){

        $('callState')
          .textContent =
          'Konekte';

      }else if(
        state ===
        'connecting'
      ){

        $('callState')
          .textContent =
          'Koneksyon...';

      }else if(
        state ===
        'disconnected'
      ){

        $('callState')
          .textContent =
          'Koneksyon koupe...';

      }else if(
        state ===
        'failed'
      ){

        $('callState')
          .textContent =
          'Koneksyon echwe';

        toast(
          'WebRTC pa rive konekte. Verifye TURN.'
        );
      }
    };
}

/* =========================
   RECEIVE CALL
========================= */

socket.on(
  'call-offer',
  async data => {

    if(
      !data?.from ||
      !data?.offer
    ){

      return;
    }

    if(
      peerConnection ||
      callTarget
    ){

      socket.emit(
        'call-reject',
        {
          to:
            data.from
        }
      );

      return;
    }

    const profile =
      profiles[
        data.from
      ];

    const name =
      profile?.displayName ||
      data.from;

    const accepted =
      window.confirm(
        `${name} ap rele ou.\n\nAksepte apèl la?`
      );

    if(!accepted){

      socket.emit(
        'call-reject',
        {
          to:
            data.from
        }
      );

      return;
    }

    callTarget =
      data.from;

    callType =
      data.type ===
      'video'
        ? 'video'
        : 'voice';

    prepareCallScreen(
      callType,
      callTarget
    );

    try{

      localStream =
        await navigator.mediaDevices
          .getUserMedia(
            callType === 'video'
              ? {
                  audio:true,
                  video:true
                }
              : {
                  audio:true,
                  video:false
                }
          );

      $('localVideo')
        .srcObject =
        localStream;

      const config =
        await getIceServers();

      peerConnection =
        new RTCPeerConnection(
          config
        );

      setupPeerEvents();

      localStream
        .getTracks()
        .forEach(
          track => {

            peerConnection
              .addTrack(
                track,
                localStream
              );
          }
        );

      await peerConnection
        .setRemoteDescription(
          new RTCSessionDescription(
            data.offer
          )
        );

      const answer =
        await peerConnection
          .createAnswer();

      await peerConnection
        .setLocalDescription(
          answer
        );

      socket.emit(
        'call-answer',
        {
          to:
            callTarget,

          answer
        }
      );

      $('callState')
        .textContent =
        'Koneksyon...';

    }catch(error){

      console.error(
        error
      );

      closeCall();

      socket.emit(
        'call-reject',
        {
          to:
            data.from
        }
      );

      toast(
        'Pa kapab aktive kamera/mikwo.'
      );
    }
  }
);

/* =========================
   CALL ANSWER
========================= */

socket.on(
  'call-answer',
  async data => {

    if(
      !peerConnection ||
      !data?.answer
    ){

      return;
    }

    try{

      await peerConnection
        .setRemoteDescription(
          new RTCSessionDescription(
            data.answer
          )
        );

      $('callState')
        .textContent =
        'Koneksyon...';

      await flushCandidates();

    }catch(error){

      console.error(
        error
      );

      toast(
        'Pa kapab finalize apèl la.'
      );
    }
  }
);

/* =========================
   ICE
========================= */

socket.on(
  'ice-candidate',
  async data => {

    if(
      !data?.candidate
    ){

      return;
    }

    if(
      !peerConnection ||
      !peerConnection
        .remoteDescription
    ){

      pendingCandidates.push(
        data.candidate
      );

      return;
    }

    try{

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

    }catch(error){

      console.warn(
        'ICE error:',
        error
      );
    }
  }
);

async function flushCandidates(){

  if(
    !peerConnection ||
    !peerConnection
      .remoteDescription
  ){

    return;
  }

  const list =
    pendingCandidates;

  pendingCandidates = [];

  for(
    const candidate
    of list
  ){

    try{

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

    }catch(error){

      console.warn(
        error
      );
    }
  }
}

/* =========================
   CALL REJECT
========================= */

socket.on(
  'call-reject',
  () => {

    toast(
      'Apèl la pa aksepte.'
    );

    closeCall();
  }
);

socket.on(
  'call-error',
  data => {

    toast(
      data?.message ||
      'Apèl la pa kapab kòmanse.'
    );

    closeCall();
  }
);

/* =========================
   CALL END
========================= */

socket.on(
  'call-end',
  () => {

    closeCall();

    toast(
      'Apèl la fini.'
    );
  }
);

/* =========================
   END CALL
========================= */

function endCall(){

  if(
    socket.connected &&
    callTarget
  ){

    socket.emit(
      'call-end',
      {
        to:
          callTarget
      }
    );
  }

  closeCall();
}

function closeCall(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    localStream = null;
  }

  if(peerConnection){

    try{

      peerConnection.close();

    }catch{}

    peerConnection = null;
  }

  pendingCandidates =
    [];

  $('localVideo')
    .srcObject =
    null;

  $('remoteVideo')
    .srcObject =
    null;

  $('remoteAudio')
    .srcObject =
    null;

  $('callScreen')
    .classList.remove(
      'show'
    );

  callTarget =
    null;

  callType =
    null;
}

$('hangBtn')
  .addEventListener(
    'click',
    endCall
  );

$('profileBtn')
  .addEventListener(
    'click',
    openProfile
  );

$('closeProfileBtn')
  .addEventListener(
    'click',
    closeProfile
  );

$('saveProfileBtn')
  .addEventListener(
    'click',
    saveProfile
  );

$('backBtn')
  .addEventListener(
    'click',
    () => {

      $('app')
        .classList.remove(
          'chat-open'
        );

      activeUser =
        null;

      $('backBtn')
        .style.display =
        'none';

      updateHeader();
    }
  );

/* =========================
   SOCKET CONNECTION
========================= */

socket.on(
  'connect',
  () => {

    updateNetwork();

    if(me){

      socket.emit(
        'register',
        {
          username:
            me.username ||
            me
        }
      );
    }
  }
);

socket.on(
  'disconnect',
  () => {

    updateNetwork();
  }
);

socket.on(
  'connect_error',
  error => {

    console.warn(
      'Socket error:',
      error.message
    );

    updateNetwork();
  }
);

socket.on(
  'force-disconnect',
  data => {

    toast(
      data?.message ||
      'Koneksyon ou a fèmen.'
    );

    socket.disconnect();
  }
);

/* =========================
   APP START
========================= */

function startApp(){

  profiles =
    loadJSON(
      STORAGE.PROFILES,
      {}
    );

  chats =
    loadJSON(
      STORAGE.CHATS,
      {}
    );

  unread =
    loadJSON(
      STORAGE.UNREAD,
      {}
    );

  const saved =
    localStorage.getItem(
      STORAGE.ME
    );

  if(saved){

    socket.connect();

    socket.once(
      'connect',
      () => {

        socket.emit(
          'register',
          {
            username:
              saved
          }
        );
      }
    );

  }else{

    showLogin();
  }

  updateNetwork();
}

window.addEventListener(
  'online',
  () => {

    updateNetwork();

    if(
      !socket.connected
    ){

      socket.connect();
    }
  }
);

window.addEventListener(
  'offline',
  updateNetwork
);

/* =========================
   SERVICE WORKER
========================= */

if(
  'serviceWorker' in
  navigator
){

  window.addEventListener(
    'load',
    () => {

      navigator.serviceWorker
        .register(
          '/sw.js'
        )
        .catch(
          error =>
            console.warn(
              'Service Worker:',
              error
            )
        );
    }
  );
}

/* =========================
   START
========================= */

startApp();

})();
</script>

</body>
</html>
