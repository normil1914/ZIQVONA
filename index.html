<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIQVONA</title><style>
:root{--t:#12b8a7;--d:#087c75;--bg:#f2fbfa;--ink:#163532}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#dff8f5,#fff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}.app{min-height:100vh;display:flex;justify-content:center;padding:18px}.phone{width:430px;height:calc(100vh - 36px);min-height:650px;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 25px 70px #087c7528;position:relative}.top{height:74px;padding:18px 20px;background:linear-gradient(135deg,var(--t),#07978c);color:#fff;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.screen{height:calc(100% - 74px);overflow:auto;padding:18px}.hidden{display:none!important}.center{text-align:center}.logo{display:inline-flex;width:78px;height:78px;border-radius:25px;background:var(--t);color:white;align-items:center;justify-content:center;font-size:44px;font-weight:900}h1{font-size:27px;margin:14px 0 7px}h2{font-size:20px;margin:8px 0}.muted{color:#718986}.card{border:1px solid #dfedeb;border-radius:20px;padding:18px;margin-top:20px}input,button{border:0;border-radius:14px;padding:14px;font-size:15px}input{background:#f1f8f7;border:1px solid #dcebe9;outline:none;flex:1}button{background:var(--t);color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#e2f7f4;color:var(--d)}button.danger{background:#e94b5f}.row{display:flex;gap:8px;align-items:center}.user{display:flex;align-items:center;gap:12px;padding:12px;margin:8px 0;background:#f7fbfa;border-radius:16px;cursor:pointer}.avatar{width:44px;height:44px;border-radius:50%;background:#c7eee9;display:flex;align-items:center;justify-content:center;color:var(--d);font-weight:900}.badge{margin-left:auto;font-size:10px;background:var(--t);color:#fff;padding:4px 8px;border-radius:99px}.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{flex:1;padding:9px;font-size:12px;background:#e7f7f5;color:var(--d)}.tabs .active{background:var(--t);color:#fff}.chat{height:calc(100% - 85px);display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:4px}.bubble{max-width:78%;padding:10px 13px;border-radius:17px;margin:7px 0}.mine{margin-left:auto;background:#d8f6f1;border-bottom-right-radius:5px}.theirs{background:#f0f5f4;border-bottom-left-radius:5px}.time{font-size:10px;color:#7a8f8c;margin-top:3px}.composer{display:flex;gap:7px}.composer button{width:52px}.call{position:absolute;inset:0;z-index:10;background:linear-gradient(160deg,#075d58,#0da79b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px}.call .avatar{width:125px;height:125px;font-size:42px;background:#d6faf6}.videos{width:100%;height:55%;position:relative}.videos video{width:100%;height:100%;object-fit:cover;border-radius:20px;background:#063f3b}.videos #local{position:absolute;width:105px;height:145px;right:10px;bottom:10px;border:2px solid #fff}.controls{display:flex;gap:12px;margin-top:20px}.controls button{width:62px;height:62px;border-radius:50%}.small{font-size:12px}
</style></head><body><div class="app"><div class="phone"><div id="top" class="top hidden"><div class="brand">ZIQVONA</div><div id="count" class="small"></div></div>
<section id="login" class="screen"><div class="center" style="margin-top:60px"><div class="logo">Z</div><h1>Byenveni sou ZIQVONA</h1><p class="muted">Chat • Apèl vwa • Apèl videyo</p><div class="card"><h2>Konekte pou teste</h2><input id="username" placeholder="Non ou, eg. Wickny"><button style="width:100%;margin-top:10px" onclick="login()">Konekte</button><p class="small muted">Pou 2 moun: itilize 2 non diferan sou 2 aparèy.</p></div></div></section>
<section id="home" class="screen hidden"><input id="search" placeholder="🔍 Chèche moun..." oninput="renderUsers()"><div class="tabs"><button class="active">Tout</button><button>Non li</button><button>Gwoup</button></div><h2>Kontak an liy</h2><div id="users"></div></section>
<section id="chat" class="screen hidden" style="padding:0 18px"><div class="row" style="padding:10px 0"><button class="secondary" style="width:48px" onclick="goHome()">←</button><div style="flex:1"><b id="chatName"></b><div id="chatStatus" class="small muted"></div></div><button class="secondary" style="width:48px" onclick="call('voice')">📞</button><button class="secondary" style="width:48px" onclick="call('video')">📹</button></div><div class="chat"><div id="messages" class="messages"></div><div id="typing" class="small muted" style="height:18px"></div><div class="composer"><input id="text" placeholder="Ekri yon mesaj..." oninput="typing()" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div></div></section>
<div id="call" class="call hidden"><div id="callTitle" class="small"></div><div id="voiceAvatar" class="avatar">Z</div><h1 id="callName"></h1><p id="callState">Apèl...</p><div id="videos" class="videos hidden"><video id="remote" autoplay playsinline></video><video id="local" autoplay muted playsinline></video></div><div class="controls"><button onclick="toggleMute()">🎤</button><button onclick="toggleCamera()" id="cam">📷</button><button class="danger" onclick="hangup()">✕</button></div></div>
</div></div><script>
let ws,user,online=[],selected,pc,localStream,muted=false,camOff=false;
const $=id=>document.getElementById(id);function login(){user=$('username').value.trim();if(!user)return alert('Mete non ou.');$('login').classList.add('hidden');$('top').classList.remove('hidden');$('home').classList.remove('hidden');connect()}function connect(){let p=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${p}://${location.host}`);ws.onopen=()=>ws.send(JSON.stringify({type:'login',username:user}));ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=()=>setTimeout(()=>user&&connect(),1500)}
function handle(m){if(m.type==='login_ok'||m.type==='presence'){online=m.online||[];$('count').textContent=online.length+' an liy';renderUsers()}if(m.type==='error')alert(m.message);if(m.type==='message'){if(m.from===selected||m.to===selected)add(m)}if(m.type==='typing'&&m.from===selected){$('typing').textContent=m.from+' ap ekri...';setTimeout(()=>$('typing').textContent='',1200)}if(m.type==='call-offer')answerCall(m);if(m.type==='call-answer'&&pc)pc.setRemoteDescription(new RTCSessionDescription(m.answer));if(m.type==='ice'&&pc&&m.candidate)pc.addIceCandidate(m.candidate);if(m.type==='call-end')hangup(false)}
function renderUsers(){let q=($('search').value||'').toLowerCase();$('users').innerHTML=online.filter(x=>x!==user&&x.toLowerCase().includes(q)).map(x=>`<div class="user" onclick="openChat('${esc(x)}')"><div class="avatar">${esc(x[0].toUpperCase())}</div><div><b>${esc(x)}</b><div class="small muted">An liy • tape pou chat</div></div><span class="badge">CHAT</span></div>`).join('')||'<p class="center muted">Pa gen lòt moun konekte kounye a.</p>'}function openChat(n){selected=n;$('home').classList.add('hidden');$('chat').classList.remove('hidden');$('chatName').textContent=n;$('chatStatus').textContent=online.includes(n)?'An liy':'Pa an liy';$('messages').innerHTML=''}function goHome(){$('chat').classList.add('hidden');$('home').classList.remove('hidden')}
function send(){let t=$('text').value.trim();if(!t||!selected)return;ws.send(JSON.stringify({type:'message',to:selected,text:t}));$('text').value=''}function typing(){if(selected&&ws.readyState===1)ws.send(JSON.stringify({type:'typing',to:selected}))}function add(m){let d=document.createElement('div');d.className='bubble '+(m.from===user?'mine':'theirs');d.innerHTML=`${esc(m.text)}<div class="time">${new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function setupPeer(){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>{if(e.candidate)ws.send(JSON.stringify({type:'ice',to:selected,candidate:e.candidate}))};pc.ontrack=e=>{$('remote').srcObject=e.streams[0]};if(!localStream){localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});$('local').srcObject=localStream}localStream.getTracks().forEach(t=>pc.addTrack(t,localStream))}
async function call(mode){if(!selected)return;try{await setupPeer();$('call').classList.remove('hidden');$('voiceAvatar').classList.toggle('hidden',mode==='video');$('videos').classList.toggle('hidden',mode!=='video');$('callName').textContent=selected;$('callTitle').textContent=mode==='video'?'APÈL VIDEYO':'APÈL VWA';$('callState').textContent='Apèl ap sòti...';let offer=await pc.createOffer();await pc.setLocalDescription(offer);ws.send(JSON.stringify({type:'call-offer',to:selected,offer,mode}))}catch(e){alert('Kamera/mikwo pa disponib. Sou telefòn, sèvi ak HTTPS.')}}
async function answerCall(m){selected=m.from;try{await setupPeer();$('call').classList.remove('hidden');$('voiceAvatar').classList.toggle('hidden',m.mode==='video');$('videos').classList.toggle('hidden',m.mode!=='video');$('callName').textContent=m.from;$('callTitle').textContent=m.mode==='video'?'APÈL VIDEYO':'APÈL VWA';$('callState').textContent='Konekte...';await pc.setRemoteDescription(new RTCSessionDescription(m.offer));let a=await pc.createAnswer();await pc.setLocalDescription(a);ws.send(JSON.stringify({type:'call-answer',to:selected,answer:a}))}catch(e){alert('Apèl la pa ka kòmanse san HTTPS ak pèmisyon kamera/mikwo.')}}function toggleMute(){muted=!muted;if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=!muted)}function toggleCamera(){camOff=!camOff;if(localStream)localStream.getVideoTracks().forEach(t=>t.enabled=!camOff)}function hangup(send=true){if(send&&selected&&ws.readyState===1)ws.send(JSON.stringify({type:'call-end',to:selected}));if(pc){pc.close();pc=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}$('call').classList.add('hidden')}
</script></body></html>
